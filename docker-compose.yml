version: '3.8'

services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: dtcall
      POSTGRES_USER: dtcall_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  web:
    build: .
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    environment:
      - APP_PORT=${APP_PORT:-8000}
      - APP_HOST=${APP_HOST:-0.0.0.0}
      - AUTO_MIGRATE_ON_STARTUP=${AUTO_MIGRATE_ON_STARTUP:-true}
      - DATABASE_ENGINE=${DATABASE_ENGINE:-postgresql}
      - DATABASE_HOST=${DATABASE_HOST:-db}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_NAME=${DATABASE_NAME:-dtcall}
      - DATABASE_USER=${DATABASE_USER:-dtcall_user}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,testserver,erp.dtcall.cn,www.dtcall.cn,dtcall.cn}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://erp.dtcall.cn,https://www.dtcall.cn,https://dtcall.cn}
      - X_FRAME_OPTIONS=${X_FRAME_OPTIONS:-SAMEORIGIN}
      - DEBUG=False
      - ONLYOFFICE_ENABLED=${ONLYOFFICE_ENABLED:-true}
      - ONLYOFFICE_SERVER_URL=${ONLYOFFICE_SERVER_URL:-http://onlyoffice}
      - ONLYOFFICE_PUBLIC_PATH=${ONLYOFFICE_PUBLIC_PATH:-/office/}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-change-me-in-production}
      - ONLYOFFICE_JWT_HEADER=${ONLYOFFICE_JWT_HEADER:-Authorization}
      - ONLYOFFICE_VERIFY_SSL=${ONLYOFFICE_VERIFY_SSL:-false}
      - ONLYOFFICE_CALLBACK_BASE_URL=${ONLYOFFICE_CALLBACK_BASE_URL:-}
    depends_on:
      - db
      - redis
      - onlyoffice
    volumes:
      - ./media:/app/media
      - ./static:/app/static
    restart: unless-stopped

  onlyoffice:
    image: onlyoffice/documentserver:latest
    ports:
      - "${ONLYOFFICE_PORT:-8082}:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-change-me-in-production}
      - JWT_HEADER=${ONLYOFFICE_JWT_HEADER:-Authorization}
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
    restart: unless-stopped

  # AI Orchestrator Sidecar (Independent process)
  ai-orchestrator:
    build: .
    command: ["python", "manage.py", "run_ai_orchestrator"]
    environment:
      - DATABASE_ENGINE=${DATABASE_ENGINE:-postgresql}
      - DATABASE_HOST=${DATABASE_HOST:-db}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_NAME=${DATABASE_NAME:-dtcall}
      - DATABASE_USER=${DATABASE_USER:-dtcall_user}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,testserver,erp.dtcall.cn,www.dtcall.cn,dtcall.cn}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://erp.dtcall.cn,https://www.dtcall.cn,https://dtcall.cn}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  project-risk-refresh:
    build: .
    command: ["python", "manage.py", "run_project_risk_refresh_scheduler", "--hour", "12", "--minute", "0"]
    environment:
      - DATABASE_ENGINE=${DATABASE_ENGINE:-postgresql}
      - DATABASE_HOST=${DATABASE_HOST:-db}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_NAME=${DATABASE_NAME:-dtcall}
      - DATABASE_USER=${DATABASE_USER:-dtcall_user}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,testserver,erp.dtcall.cn,www.dtcall.cn,dtcall.cn}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://erp.dtcall.cn,https://www.dtcall.cn,https://dtcall.cn}
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_lib:
