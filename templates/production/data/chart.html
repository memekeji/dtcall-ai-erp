{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ equipment.name }} - 数据图表</title>
    <link rel="stylesheet" href="{% static 'layui/css/layui.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>

<body>
    <div class="layui-fluid" style="padding: 20px;">
        <!-- 页面标题 -->
        <div class="layui-row">
            <div class="layui-col-md12">
                <h2 style="margin-bottom: 20px;">{{ equipment.name }} - 数据图表</h2>
                <p style="color: #666;">设备编号：{{ equipment.code }}</p>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="layui-row">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-header">最近数据趋势</div>
                    <div class="layui-card-body">
                        <div id="dataChart" style="height: 400px; width: 100%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="layui-row" style="margin-top: 20px;">
            <div class="layui-col-md12">
                <button class="layui-btn layui-btn-primary" onclick="openRightPopup('详情', '{% url 'production:equipment_detail' equipment.pk %}')">
                    <i class="layui-icon layui-icon-return"></i> 返回设备详情
                </button>
                <button class="layui-btn layui-btn-primary" onclick="location.href='{% url 'production:data_collection_list' %}?equipment={{ equipment.pk }}'">
                    <i class="layui-icon layui-icon-list"></i> 查看数据列表
                </button>
                <button class="layui-btn layui-btn-primary" onclick="refreshChart()">
                    <i class="layui-icon layui-icon-refresh"></i> 刷新数据
                </button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'layui/layui.js' %}"></script>
    <script>
        layui.use(['layer'], function () {
            var layer = layui.layer;
        });

        function refreshChart() {
            location.reload();
        }

        document.addEventListener('DOMContentLoaded', function() {
            var chartDom = document.getElementById('dataChart');
            var myChart = echarts.init(chartDom);

            var timestamps = [];
            var values = [];

            {% for dp in data_points reversed %}
                timestamps.push('{{ dp.timestamp|date:"m-d H:i:s" }}');
                values.push(parseFloat('{{ dp.metric_value|escapejs }}') || 0);
            {% empty %}
                // No data
            {% endfor %}

            var option = {
                tooltip: {
                    trigger: 'axis'
                },
                xAxis: {
                    type: 'category',
                    data: timestamps
                },
                yAxis: {
                    type: 'value'
                },
                series: [
                    {
                        name: '参数值',
                        data: values,
                        type: 'line',
                        smooth: true,
                        areaStyle: {
                            opacity: 0.3
                        },
                        itemStyle: {
                            color: '#1E9FFF'
                        }
                    }
                ]
            };

            if (timestamps.length === 0) {
                option.title = {
                    text: '暂无数据',
                    left: 'center',
                    top: 'center',
                    textStyle: {
                        color: '#999',
                        fontWeight: 'normal',
                        fontSize: 14
                    }
                };
            }

            myChart.setOption(option);

            window.addEventListener('resize', function() {
                myChart.resize();
            });
        });

        {% include "production/_right_popup_function.html" %}
</script>

    <!-- 注入的消息提示脚本 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var msgs = [
                {% for message in messages %}
                    { level: "{{ message.tags }}", text: "{{ message|escapejs }}" },
                {% endfor %}
            ];

            if (msgs.length > 0 && typeof layui !== 'undefined') {
                layui.use(['layer'], function() {
                    msgs.forEach(function(m) {
                        var icon = m.level.indexOf('success') !== -1 ? 1 : (m.level.indexOf('error') !== -1 ? 2 : 0);
                        layui.layer.msg(m.text, {icon: icon, time: 3000, offset: 't'});
                    });
                });
            }
        });
    </script>
</body>

</html>
