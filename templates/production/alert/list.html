{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>告警中心</title>
    <link rel="stylesheet" href="{% static 'layui/css/layui.css' %}">
    <link rel="stylesheet" href="{% static 'css/dtcall-ui.css' %}">
    <link rel="stylesheet" href="{% static 'production/css/common.css' %}">
</head>
<body>
    <div class="layui-fluid production-container">
        <div class="production-page-title">
            <h2>告警中心</h2>
        </div>

        <div class="production-note">
            这里展示的是生产监控规则触发后的项目内告警。若当前为空，通常表示尚未产生未确认异常，或设备实时采集链路还未产生活跃事件。
        </div>

        <div class="layui-card production-panel-card" style="margin-top: 16px;">
            <div class="layui-card-body" style="padding: 18px 20px;">
                <form class="layui-form production-list-toolbar" onsubmit="return false;">
                    {% csrf_token %}
                    <div class="production-inline-actions">
                        <div class="layui-inline">
                            <label class="layui-form-label" style="width: 80px;">优先级</label>
                            <div class="layui-input-inline">
                                <select id="severityFilter">
                                    <option value="">全部</option>
                                    <option value="high">高</option>
                                    <option value="medium">中</option>
                                    <option value="low">低</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label" style="width: 80px;">时间范围</label>
                            <div class="layui-input-inline">
                                <select id="timeRangeFilter">
                                    <option value="all">全部</option>
                                    <option value="today">今天</option>
                                    <option value="week">本周</option>
                                    <option value="month">本月</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="production-inline-actions">
                        <button class="layui-btn layui-btn-normal" type="button" onclick="loadAlerts()">更新告警</button>
                        <button class="layui-btn layui-btn-primary" type="button" onclick="resetFilter()">重置条件</button>
                        <button class="layui-btn layui-btn-danger" type="button" onclick="acknowledgeAll()">全部确认</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="production-summary-strip" style="margin-top: 16px;">
            <div class="production-summary-item">
                <div class="production-summary-value" id="highCount">0</div>
                <div class="production-summary-label">高优先级</div>
            </div>
            <div class="production-summary-item">
                <div class="production-summary-value" id="mediumCount">0</div>
                <div class="production-summary-label">中优先级</div>
            </div>
            <div class="production-summary-item">
                <div class="production-summary-value" id="lowCount">0</div>
                <div class="production-summary-label">低优先级</div>
            </div>
            <div class="production-summary-item accent">
                <div class="production-summary-value" id="totalCount">0</div>
                <div class="production-summary-label">当前告警总数</div>
            </div>
        </div>

        <div class="production-section-card" style="margin-top: 16px;">
            <div class="production-section-header">告警列表</div>
            <div class="production-section-body">
                <div class="production-kpi-list" id="alertList">
                    <div class="production-empty">正在加载告警数据...</div>
                </div>
            </div>
        </div>

        <div class="production-toolbar" style="margin-top: 16px;">
            <div class="production-inline-actions">
                <a class="layui-btn layui-btn-primary" href="{% url 'production:equipment_monitor_realtime' %}">设备监控</a>
                <a class="layui-btn layui-btn-primary" href="{% url 'production:performance_analysis' %}">性能分析</a>
                <a class="layui-btn layui-btn-primary" href="{% url 'production:equipment_list' %}">设备管理</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'layui/layui.js' %}"></script>
    <script>
        var allAlerts = [];

        function getCsrfToken() {
            var token = document.querySelector('input[name="csrfmiddlewaretoken"]');
            return token ? token.value : '';
        }

        function severityLabel(severity) {
            if (severity === 'high') return '高';
            if (severity === 'medium') return '中';
            return '低';
        }

        function severityClass(severity) {
            if (severity === 'high') return 'danger';
            if (severity === 'medium') return 'warn';
            return 'ok';
        }

        function updateAlertStats(alerts) {
            var high = alerts.filter(function (item) { return item.severity === 'high'; }).length;
            var medium = alerts.filter(function (item) { return item.severity === 'medium'; }).length;
            var low = alerts.filter(function (item) { return item.severity === 'low'; }).length;
            $('#highCount').text(high);
            $('#mediumCount').text(medium);
            $('#lowCount').text(low);
            $('#totalCount').text(alerts.length);
        }

        function renderAlerts(alerts) {
            if (!alerts.length) {
                $('#alertList').html('<div class="production-empty">当前筛选条件下没有告警。可以返回设备监控页检查是否已有实时采集或异常规则触发。</div>');
                return;
            }

            var html = '';
            alerts.forEach(function (alert) {
                html += '<div class="production-kpi-item">'
                    + '<div>'
                    + '<div class="production-kpi-title">' + alert.name + '</div>'
                    + '<div class="production-kpi-meta">' + alert.message + '</div>'
                    + '<div class="production-kpi-meta">发生时间：' + new Date(alert.timestamp).toLocaleString() + (alert.equipment_id ? ' · 设备 #' + alert.equipment_id : '') + '</div>'
                    + '</div>'
                    + '<div class="production-inline-actions compact">'
                    + '<span class="production-tag ' + severityClass(alert.severity) + '">' + severityLabel(alert.severity) + '</span>';
                if (!alert.acknowledged) {
                    html += '<button class="layui-btn layui-btn-xs" onclick="acknowledgeAlert(\'' + alert.id + '\')">确认</button>';
                } else {
                    html += '<span class="production-chip ok">已确认</span>';
                }
                html += '<button class="layui-btn layui-btn-xs layui-btn-primary" onclick="viewAlertDetail(\'' + alert.id + '\')">详情</button>'
                    + '</div>'
                    + '</div>';
            });
            $('#alertList').html(html);
        }

        function loadAlerts() {
            $.getJSON('/production/alert/api/', {
                severity: $('#severityFilter').val(),
                time_range: $('#timeRangeFilter').val()
            }, function (response) {
                if (!response.success) {
                    layui.layer.msg(response.message || '告警加载失败', {icon: 2});
                    return;
                }
                allAlerts = response.alerts || [];
                updateAlertStats(allAlerts);
                renderAlerts(allAlerts);
            });
        }

        function acknowledgeAlert(alertId) {
            $.ajax({
                url: '/production/alert/acknowledge/' + alertId + '/',
                method: 'POST',
                data: {
                    csrfmiddlewaretoken: getCsrfToken()
                },
                success: function (response) {
                    if (!response.success) {
                        layui.layer.msg(response.message || '确认失败', {icon: 2});
                        return;
                    }
                    layui.layer.msg('告警已确认', {icon: 1});
                    loadAlerts();
                }
            });
        }

        function acknowledgeAll() {
            var pending = allAlerts.filter(function (item) { return !item.acknowledged; });
            if (!pending.length) {
                layui.layer.msg('当前没有待确认告警', {icon: 0});
                return;
            }
            layui.layer.confirm('确定确认全部未处理告警吗？', {icon: 3, title: '批量确认'}, function (index) {
                var requests = pending.map(function (item) {
                    return $.ajax({
                        url: '/production/alert/acknowledge/' + item.id + '/',
                        method: 'POST',
                        data: { csrfmiddlewaretoken: getCsrfToken() }
                    });
                });
                $.when.apply($, requests).always(function () {
                    layui.layer.close(index);
                    loadAlerts();
                    layui.layer.msg('已完成批量确认', {icon: 1});
                });
            });
        }

        function viewAlertDetail(alertId) {
            var alert = allAlerts.find(function (item) { return item.id === alertId; });
            if (!alert) {
                return;
            }
            var content = '<div style="padding: 20px;">'
                + '<div class="production-kpi-list">'
                + '<div class="production-kpi-item"><div><div class="production-kpi-title">告警名称</div><div class="production-kpi-meta">' + alert.name + '</div></div><span class="production-tag ' + severityClass(alert.severity) + '">' + severityLabel(alert.severity) + '</span></div>'
                + '<div class="production-kpi-item"><div><div class="production-kpi-title">告警信息</div><div class="production-kpi-meta">' + alert.message + '</div></div><span class="production-chip ' + (alert.acknowledged ? 'ok' : 'warn') + '">' + (alert.acknowledged ? '已确认' : '待确认') + '</span></div>'
                + '<div class="production-kpi-item"><div><div class="production-kpi-title">发生时间</div><div class="production-kpi-meta">' + new Date(alert.timestamp).toLocaleString() + '</div></div><span class="production-chip">' + (alert.equipment_id ? ('设备 #' + alert.equipment_id) : '系统级') + '</span></div>'
                + '</div></div>';
            layui.layer.open({
                type: 1,
                title: '告警详情',
                area: ['620px', '420px'],
                content: content
            });
        }

        function resetFilter() {
            $('#severityFilter').val('');
            $('#timeRangeFilter').val('all');
            layui.form.render('select');
            loadAlerts();
        }

        layui.use(['form', 'layer'], function () {
            layui.form.render();
        });

        $(function () {
            loadAlerts();
        });

        {% include "production/_right_popup_function.html" %}
    </script>
    {% include "production/_popup_feedback.html" %}
</body>
</html>
