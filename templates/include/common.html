<!DOCTYPE html>
<html lang="zh">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}DTCALL管理后台{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'layui/css/layui.css' %}">
    <link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="layui-container" style="padding: 20px;">
        {% block content %}
        {% endblock %}
    </div>

    <script src="{% static 'layui/layui.js' %}"></script>
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script>
    layui.use(['jquery', 'layer'], function(){
        var $ = layui.jquery;

        $.ajaxSetup({
            beforeSend: function(xhr, settings) {
                if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type) && !this.crossDomain) {
                    var csrfToken = $('meta[name="csrf-token"]').attr('content');
                    if (csrfToken) {
                        xhr.setRequestHeader("X-CSRFToken", csrfToken);
                    }
                }
            }
        });
    });
    </script>
    {% block extra_js %}{% endblock %}

    <!-- 注入的消息提示脚本 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var msgs = [
                {% for message in messages %}
                    { level: "{{ message.tags }}", text: "{{ message|escapejs }}" },
                {% endfor %}
            ];

            if (msgs.length > 0 && typeof layui !== 'undefined') {
                layui.use(['layer'], function() {
                    msgs.forEach(function(m) {
                        var icon = m.level.indexOf('success') !== -1 ? 1 : (m.level.indexOf('error') !== -1 ? 2 : 0);
                        layui.layer.msg(m.text, {icon: icon, time: 3000, offset: 't'});
                    });
                });
            }
        });
    </script>
</body>
</html>
