{% extends 'include/common.html' %}
{% load static %}

{% block title %}{{ page_title }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/supply_chain.css' %}">
{% endblock %}

{% block content %}
<div class="layui-card">
    <div class="layui-card-header">
        <h3>{{ page_title }}</h3>
    </div>
    <div class="layui-card-body">
        <form class="layui-form sc-form-grid" method="post">
            {% csrf_token %}
            <div class="sc-form-section">
                <div class="sc-form-section-title">复核主单</div>
                <div class="layui-row layui-col-space15">
                    <div class="layui-col-md4">
                        <div class="layui-form-item">
                            <label class="layui-form-label">物料</label>
                            <div class="layui-input-block">{{ form.inventory_item }}</div>
                        </div>
                    </div>
                    <div class="layui-col-md4">
                        <div class="layui-form-item">
                            <label class="layui-form-label">供应商</label>
                            <div class="layui-input-block">{{ form.supplier }}</div>
                        </div>
                    </div>
                    <div class="layui-col-md4">
                        <div class="layui-form-item">
                            <label class="layui-form-label">报价单价</label>
                            <div class="layui-input-block">{{ form.quoted_price }}</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn" type="submit">保存复核单</button>
                    <a href="{% url 'supply_chain:price_review_list' %}" class="layui-btn layui-btn-primary">返回列表</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
