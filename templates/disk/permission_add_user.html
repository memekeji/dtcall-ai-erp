{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加用户权限</title>
    <link rel="stylesheet" href="{% static 'layui/css/layui.css' %}">
    <style>
        :root {
            --ink: #17212f;
            --muted: #687589;
            --line: #dfe6ee;
            --soft: #f4f7fb;
            --brand: #126b64;
            --brand-soft: #e6f5f2;
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; background: #eef3f7; color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; }
        .page { min-height: 100vh; padding: 10px; }
        .shell { min-height: calc(100vh - 20px); border: 1px solid rgba(223, 230, 238, 0.9); background: #fff; box-shadow: 0 12px 28px rgba(23, 33, 47, 0.08); overflow: hidden; }

        .head { display: flex; justify-content: space-between; gap: 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid #edf1f6; background: linear-gradient(90deg, rgba(18, 107, 100, 0.08), rgba(255,255,255,0)); }
        .head h1 { margin: 0; font-size: 17px; font-weight: 700; }
        .head .meta { margin-top: 4px; color: var(--muted); font-size: 12px; }
        .badge { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border: 1px solid var(--line); background: var(--brand-soft); color: #0b554f; font-size: 12px; font-weight: 700; }

        .content { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: calc(100vh - 82px); }
        .left, .right { min-width: 0; }
        .left { border-right: 1px solid #edf1f6; background: #f8fafc; }
        .right { background: #fff; }
        .panel-head { padding: 12px 14px; border-bottom: 1px solid #edf1f6; font-size: 14px; font-weight: 700; }
        .panel-body { padding: 12px 14px; }
        .tree-box { max-height: calc(100vh - 150px); overflow: auto; }
        .user-box { max-height: calc(100vh - 280px); overflow: auto; }

        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .layui-btn { border-radius: 0; font-weight: 700; }

        .search { margin-bottom: 8px; }
        .search input { width: 100%; }

        .user-item {
            display: grid;
            grid-template-columns: 18px minmax(0, 1fr);
            gap: 10px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #edf1f6;
        }

        .user-item:last-child { border-bottom: 0; }
        .user-info h4 { margin: 0 0 4px; font-size: 14px; }
        .user-info p { margin: 0; color: var(--muted); font-size: 12px; }

        .summary {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-top: 10px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            background: #fbfcfe;
        }

        .summary strong { font-size: 14px; }
        .summary span { color: var(--muted); font-size: 12px; }

        .permission-box {
            margin-top: 10px;
            padding: 12px;
            border: 1px solid var(--line);
            background: #fff;
        }

        .permission-box h3 { margin: 0 0 8px; font-size: 14px; }
        .permission-options { display: flex; gap: 14px; flex-wrap: wrap; }
        .permission-option { display: inline-flex; align-items: center; gap: 6px; }

        .footer {
            display: flex;
            gap: 10px;
            padding: 12px 14px 14px;
            border-top: 1px solid #edf1f6;
            background: #fff;
        }

        .footer .layui-btn { flex: 1; }
        .empty { padding: 26px 10px; text-align: center; color: var(--muted); }
        .empty .layui-icon { display: block; margin-bottom: 8px; font-size: 30px; color: #c5d0db; }

        @media (max-width: 960px) {
            .content { grid-template-columns: 1fr; }
            .left { border-right: 0; border-bottom: 1px solid #edf1f6; }
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="shell">
            <div class="head">
                <div>
                    <h1>添加用户权限</h1>
                    <div class="meta">{{ item_type_name }} · {{ item_name }}</div>
                </div>
                <div class="badge"><i class="layui-icon layui-icon-group"></i> 按部门筛选用户</div>
            </div>

            <div class="content">
                <section class="left">
                    <div class="panel-head">部门树</div>
                    <div class="panel-body tree-box" id="deptTree"></div>
                </section>

                <section class="right">
                    <div class="panel-head">
                        <div class="toolbar">
                            <button class="layui-btn layui-btn-sm" onclick="selectAllUsers()"><i class="layui-icon layui-icon-ok-circle"></i> 全选</button>
                            <button class="layui-btn layui-btn-sm layui-btn-normal" onclick="selectInverseUsers()"><i class="layui-icon layui-icon-refresh"></i> 反选</button>
                            <button class="layui-btn layui-btn-sm layui-btn-primary" onclick="clearSelectedUsers()"><i class="layui-icon layui-icon-close"></i> 清空</button>
                        </div>
                        <div class="search">
                            <input type="text" class="layui-input" placeholder="搜索用户" id="userSearch" onkeyup="searchUsers()">
                        </div>
                    </div>

                    <div class="panel-body user-box" id="userList"></div>

                    <div class="summary">
                        <div>
                            <strong id="selectedCount">已选 0 人</strong>
                            <span id="selectedUserNames">暂无选择</span>
                        </div>
                    </div>

                    <div class="panel-body">
                        <div class="permission-box">
                            <h3>权限级别</h3>
                            <div class="permission-options">
                                <label class="permission-option"><input type="radio" name="permission_level" value="1" checked> <span>只读</span></label>
                                <label class="permission-option"><input type="radio" name="permission_level" value="2"> <span>读写</span></label>
                                <label class="permission-option"><input type="radio" name="permission_level" value="3"> <span>管理</span></label>
                            </div>
                        </div>
                    </div>

                    <div class="footer">
                        <button class="layui-btn" onclick="savePermissions()"><i class="layui-icon layui-icon-ok"></i> 保存</button>
                        <button class="layui-btn layui-btn-primary" onclick="closeDialog()"><i class="layui-icon layui-icon-close"></i> 取消</button>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'layui/layui.js' %}"></script>
    <script>
        var selectedUsers = [];
        var currentDeptId = null;
        var allUsers = [];
        var existingPermissionUsers = [];
        var departmentTree = {{ department_tree_json|safe }};

        function uniqueById(list) {
            var seen = new Set();
            return list.filter(function(item) {
                if (seen.has(item.id)) return false;
                seen.add(item.id);
                return true;
            });
        }

        function formatDeptPath(dept) {
            if (!dept) return '无部门';
            return dept.title || dept.name || '无部门';
        }

        function renderUserList(users) {
            var userList = $('#userList');
            userList.empty();

            if (!users || users.length === 0) {
                userList.html('<div class="empty"><i class="layui-icon layui-icon-user"></i>该部门暂无用户</div>');
                return;
            }

            users.forEach(function(user) {
                var isSelected = selectedUsers.some(function(u) { return String(u.id) === String(user.id); });
                var checked = isSelected ? 'checked' : '';
                var disabled = '';
                userList.append(`
                    <div class="user-item">
                        <input type="checkbox" lay-skin="primary" ${checked} ${disabled}
                               data-user-id="${user.id}"
                               data-user-name="${user.username}"
                               data-user-realname="${user.name || ''}">
                        <div class="user-info">
                            <h4>${user.username}</h4>
                            <p>${user.name || user.username} · ${formatDeptPath(user.department)}</p>
                        </div>
                    </div>
                `);
            });

            layui.use('form', function() { layui.form.render('checkbox'); });
        }

        function loadUsersByDept(deptId) {
            currentDeptId = deptId;
            $.get('/disk/permission/user/list/', {
                dept_id: deptId,
                csrfmiddlewaretoken: '{{ csrf_token }}'
            }, function(response) {
                if (response.code === 0) {
                    allUsers = response.data.users || [];
                    renderUserList(allUsers);
                } else {
                    layui.use('layer', function() {
                        layui.layer.msg(response.msg || '加载失败', {icon: 2});
                    });
                }
            });
        }

        function updateSelectedUsers() {
            selectedUsers = uniqueById(selectedUsers);
            $('#selectedCount').text('已选 ' + selectedUsers.length + ' 人');
            $('#selectedUserNames').text(selectedUsers.length ? selectedUsers.map(function(user) {
                return user.realname || user.username;
            }).join('、') : '暂无选择');
        }

        layui.use(['form', 'tree'], function () {
            layui.form.render();
            layui.tree.render({
                elem: '#deptTree',
                data: departmentTree,
                onlyIconControl: false,
                click: function(obj) {
                    loadUsersByDept(obj.data.id);
                }
            });
            if (departmentTree.length) {
                loadUsersByDept(departmentTree[0].id);
            }
        });

        $(document).on('change', '#userList input[type="checkbox"]', function() {
            var userId = $(this).data('user-id');
            var userName = $(this).data('user-name');
            var userRealname = $(this).data('user-realname');

            if (this.checked) {
                if (!selectedUsers.some(function(u) { return String(u.id) === String(userId); })) {
                    selectedUsers.push({ id: userId, username: userName, realname: userRealname });
                }
            } else {
                selectedUsers = selectedUsers.filter(function(user) {
                    return String(user.id) !== String(userId);
                });
            }
            updateSelectedUsers();
        });

        function searchUsers() {
            var searchTerm = ($('#userSearch').val() || '').toLowerCase();
            var filteredUsers = allUsers.filter(function(user) {
                return user.username.toLowerCase().includes(searchTerm) || (user.name && user.name.toLowerCase().includes(searchTerm));
            });
            renderUserList(filteredUsers);
        }

        function selectAllUsers() {
            $('#userList input[type="checkbox"]').each(function() {
                this.checked = true;
                var userId = $(this).data('user-id');
                var userName = $(this).data('user-name');
                var userRealname = $(this).data('user-realname');
                if (!selectedUsers.some(function(u) { return String(u.id) === String(userId); })) {
                    selectedUsers.push({ id: userId, username: userName, realname: userRealname });
                }
            });
            layui.use('form', function() { layui.form.render('checkbox'); });
            updateSelectedUsers();
        }

        function selectInverseUsers() {
            $('#userList input[type="checkbox"]').each(function() {
                this.checked = !this.checked;
                var userId = $(this).data('user-id');
                var userName = $(this).data('user-name');
                var userRealname = $(this).data('user-realname');
                if (this.checked) {
                    if (!selectedUsers.some(function(u) { return String(u.id) === String(userId); })) {
                        selectedUsers.push({ id: userId, username: userName, realname: userRealname });
                    }
                } else {
                    selectedUsers = selectedUsers.filter(function(user) {
                        return String(user.id) !== String(userId);
                    });
                }
            });
            layui.use('form', function() { layui.form.render('checkbox'); });
            updateSelectedUsers();
        }

        function clearSelectedUsers() {
            selectedUsers = [];
            $('#userList input[type="checkbox"]').prop('checked', false);
            layui.use('form', function() { layui.form.render('checkbox'); });
            updateSelectedUsers();
        }

        function savePermissions() {
            if (selectedUsers.length === 0) {
                layui.use('layer', function() { layui.layer.msg('请至少选择一个用户', {icon: 2}); });
                return;
            }

            var permissionLevel = $('input[name="permission_level"]:checked').val();
            var permissions = selectedUsers.map(function(user) {
                return { user_id: user.id, permission_level: permissionLevel };
            });

            $.post('/disk/permission/user/', {
                item_type: '{{ item_type }}',
                item_id: '{{ item_id }}',
                permissions: JSON.stringify(permissions),
                csrfmiddlewaretoken: '{{ csrf_token }}'
            }, function(response) {
                layui.use('layer', function() {
                    layui.layer.msg(response.msg || '操作完成', {icon: response.code === 0 ? 1 : 2});
                    if (response.code === 0) {
                        setTimeout(function() { closeDialog(true); }, 600);
                    }
                });
            });
        }

        function closeDialog(refreshParent) {
            if (parent && parent.layer) {
                var index = parent.layer.getFrameIndex(window.name);
                parent.layer.close(index);
                if (refreshParent && parent.location) {
                    setTimeout(function() { parent.location.reload(); }, 100);
                }
                return;
            }
            window.history.back();
        }
    </script>
</body>
</html>
