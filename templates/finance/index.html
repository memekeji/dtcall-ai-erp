{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>财务管理</title>
    <link rel="stylesheet" href="{% static 'layui/css/layui.css' %}">
    <style>
        .finance-card {
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .finance-card:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #009688;
        }
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="layui-fluid">
        <!-- 财务统计概览 -->
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md3">
                <div class="layui-card finance-card">
                    <div class="layui-card-body" style="text-align: center;">
                        <div class="stat-number" id="totalOrders">0</div>
                        <div class="stat-label">订单总数</div>
                    </div>
                </div>
            </div>
            <div class="layui-col-md3">
                <div class="layui-card finance-card">
                    <div class="layui-card-body" style="text-align: center;">
                        <div class="stat-number" id="totalAmount">¥0.00</div>
                        <div class="stat-label">订单总金额</div>
                    </div>
                </div>
            </div>
            <div class="layui-col-md3">
                <div class="layui-card finance-card">
                    <div class="layui-card-body" style="text-align: center;">
                        <div class="stat-number" id="pendingPayment">0</div>
                        <div class="stat-label">待付款订单</div>
                    </div>
                </div>
            </div>
            <div class="layui-col-md3">
                <div class="layui-card finance-card">
                    <div class="layui-card-body" style="text-align: center;">
                        <div class="stat-number" id="pendingInvoices">0</div>
                        <div class="stat-label">待审核开票申请</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md3"><div class="layui-card finance-card"><div class="layui-card-body" style="text-align: center;"><div class="stat-number" id="accountBalance">¥0.00</div><div class="stat-label">资金账户余额</div></div></div></div>
            <div class="layui-col-md3"><div class="layui-card finance-card"><div class="layui-card-body" style="text-align: center;"><div class="stat-number" id="budgetUsed">¥0.00</div><div class="stat-label">预算已用金额</div></div></div></div>
            <div class="layui-col-md3"><div class="layui-card finance-card"><div class="layui-card-body" style="text-align: center;"><div class="stat-number" id="receivableRemain">¥0.00</div><div class="stat-label">应收未收金额</div></div></div></div>
            <div class="layui-col-md3"><div class="layui-card finance-card"><div class="layui-card-body" style="text-align: center;"><div class="stat-number" id="riskWarnings">0</div><div class="stat-label">风险预警</div></div></div></div>
        </div>

        <!-- 功能菜单 -->
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md6">
                <div class="layui-card">
                    <div class="layui-card-header">订单财务管理</div>
                    <div class="layui-card-body">
                        <div class="layui-btn-group">
                            <button class="layui-btn" onclick="openPage('/order-finance/')">
                                <i class="layui-icon layui-icon-dollar"></i> 订单财务记录
                            </button>
                            <button class="layui-btn layui-btn-normal" onclick="openPage('/reimbursement/')">
                                <i class="layui-icon layui-icon-file-b"></i> 报销管理
                            </button>
                        </div>
                        <p style="margin-top: 10px; color: #666; font-size: 14px;">
                            管理订单财务记录，跟踪付款状态，处理报销申请
                        </p>
                    </div>
                </div>
            </div>
            
            <div class="layui-col-md6">
                <div class="layui-card">
                    <div class="layui-card-header">开票管理</div>
                    <div class="layui-card-body">
                        <div class="layui-btn-group">
                            <button class="layui-btn layui-btn-warm" onclick="openPage('/invoice-request/')">
                                <i class="layui-icon layui-icon-survey"></i> 开票申请管理
                            </button>
                            <button class="layui-btn" onclick="openPage('/invoice/')">
                                <i class="layui-icon layui-icon-template-1"></i> 发票管理
                            </button>
                        </div>
                        <p style="margin-top: 10px; color: #666; font-size: 14px;">
                            处理开票申请，管理发票记录，跟踪回款状态
                        </p>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-header">专业财务管理</div>
                    <div class="layui-card-body">
                        <div class="layui-btn-container">
                            <button class="layui-btn" onclick="openPage('/advanced/account/')">资金账户</button>
                            <button class="layui-btn layui-btn-normal" onclick="openPage('/advanced/budget/')">预算管理</button>
                            <button class="layui-btn layui-btn-warm" onclick="openPage('/advanced/receivable/')">应收账款</button>
                            <button class="layui-btn layui-btn-danger" onclick="openPage('/advanced/payable/')">应付账款</button>
                            <button class="layui-btn" onclick="openPage('/advanced/bank-transaction/')">银行流水</button>
                            <button class="layui-btn layui-btn-normal" onclick="openPage('/advanced/bank-reconciliation/')">银行对账</button>
                            <button class="layui-btn layui-btn-primary" onclick="openPage('/advanced/ledger-voucher/')">总账凭证</button>
                            <button class="layui-btn" onclick="openPage('/advanced/chart-account/')">会计科目</button>
                            <button class="layui-btn layui-btn-normal" onclick="openPage('/advanced/voucher-line/')">凭证明细</button>
                            <button class="layui-btn layui-btn-warm" onclick="openPage('/advanced/tax/')">税务管理</button>
                            <button class="layui-btn" onclick="openPage('/advanced/fixed-asset/')">固定资产</button>
                            <button class="layui-btn layui-btn-normal" onclick="openPage('/advanced/cost-allocation/')">成本分摊</button>
                            <button class="layui-btn" onclick="openPage('/advanced/cash-flow-plan/')">现金流计划</button>
                            <button class="layui-btn layui-btn-normal" onclick="openPage('/advanced/financial-ratio/')">财务指标</button>
                            <button class="layui-btn layui-btn-warm" onclick="openPage('/advanced/expense-accrual/')">费用计提</button>
                            <button class="layui-btn layui-btn-danger" onclick="openPage('/advanced/period-close/')">期间结账</button>
                            <button class="layui-btn layui-btn-primary" onclick="openPage('/advanced/financial-report/')">财务报表</button>
                        </div>
                        <p style="margin-top: 10px; color: #666; font-size: 14px;">
                            覆盖资金、预算、往来、银行、对账和总账凭证等专业财务业务闭环。
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 最近开票申请 -->
        <div class="layui-card">
            <div class="layui-card-header">
                最近开票申请
                <span class="layui-btn layui-btn-xs layui-btn-primary" style="float: right;" onclick="openPage('/invoice-request/')">查看全部</span>
            </div>
            <div class="layui-card-body">
                <table id="recentRequests" class="layui-table" lay-filter="recentRequests"></table>
            </div>
        </div>
    </div>

    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'layui/layui.js' %}"></script>
    <script>
        layui.use(['table', 'layer'], function() {
            var table = layui.table;
            var layer = layui.layer;

            // 加载统计数据
            function loadStatistics() {
                $.ajax({
                    url: '/adm/finance/statistics/',
                    type: 'GET',
                    success: function(response) {
                        if (response.code === 0) {
                            var data = response.data || {};
                            var orderStats = data.order_stats || {};
                            var pendingStats = data.pending || {};
                            var accountStats = data.account_stats || {};
                            var budgetStats = data.budget_stats || {};
                            var receivableStats = data.receivable_stats || {};
                            var riskStats = data.risk_stats || {};
                            var riskTotal = Number(riskStats.overdue_receivables || 0) + Number(riskStats.overdue_payables || 0) + Number(riskStats.bank_differences || 0) + Number(riskStats.unposted_vouchers || 0) + Number(riskStats.overdue_taxes || 0) + Number(riskStats.overdue_cash_plans || 0) + Number(riskStats.risk_ratios || 0);
                            $('#totalOrders').text(orderStats.total_count || 0);
                            $('#totalAmount').text('¥' + Number(orderStats.total_amount || 0).toFixed(2));
                            $('#pendingPayment').text(orderStats.pending_count || 0);
                            $('#pendingInvoices').text(pendingStats.requests || 0);
                            $('#accountBalance').text('¥' + Number(accountStats.total_balance || 0).toFixed(2));
                            $('#budgetUsed').text('¥' + Number(budgetStats.used_amount || 0).toFixed(2));
                            $('#receivableRemain').text('¥' + Number(receivableStats.remaining_amount || 0).toFixed(2));
                            $('#riskWarnings').text(riskTotal);
                        }
                    },
                    error: function(xhr) {
                        console.error('加载统计数据失败:', xhr);
                    }
                });
            }

            // 初始化最近开票申请表格
            table.render({
                elem: '#recentRequests',
                url: '/adm/finance/invoice-request/datalist/?limit=5',
                cols: [[
                    {field: 'order_id', title: '订单ID', width: 120},
                    {field: 'amount', title: '开票金额', width: 120},
                    {field: 'status_display', title: '申请状态', width: 120},
                    {field: 'applicant_id', title: '申请人ID', width: 120},
                    {field: 'create_time', title: '申请时间', width: 180}
                ]],
                limit: 5,
                page: false,
                height: 300
            });

            // 页面加载时获取统计数据
            loadStatistics();
        });

        // 打开页面
        function openPage(url) {
            if (!url.startsWith('/adm/finance/')) {
                url = '/adm/finance' + url;
            }
            layui.layer.open({
                type: 2,
                title: '财务功能',
                shadeClose: false,
                shade: 0.3,
                maxmin: true,
                area: ['80%', '100%'],
                offset: 'r',
                anim: 2,
                content: url,
                success: function(layero) {
                    layero.css({'right': '0', 'top': '0', 'height': '100%'});
                }
            });
        }
    </script>

</body>
</html>
