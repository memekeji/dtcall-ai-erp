{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报销统计</title>
    <link rel="stylesheet" href="{% static 'layui/css/layui.css' %}">
    <link rel="stylesheet" href="{% static 'css/dtcall-ui.css' %}">
    <link rel="stylesheet" href="{% static 'css/finance-module.css' %}">
    <style>
        .stat-item {
            min-width: 0;
            text-align: center;
            padding: 16px;
        }
        .stat-value {
            font-size: 26px;
            font-weight: bold;
            color: #172033;
        }
        .stat-label {
            font-size: 13px;
            color: #5b6b80;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="layui-fluid finance-shell">
        <div class="finance-page-header">
            <div>
                <h1 class="finance-page-title">报销统计</h1>
                <p class="finance-page-subtitle">统一查看报销总额、审核待办和打款进度，减少付款前人工核对。</p>
            </div>
        </div>
        <div class="layui-card finance-card-shell">
            <div class="layui-card-header">报销统计分析</div>
            <div class="layui-card-body">
                <div class="finance-stat-grid">
                    <div class="finance-summary-card stat-item">
                        <div class="stat-value" id="totalReimbursement">0</div>
                        <div class="stat-label">总报销笔数</div>
                    </div>
                    <div class="finance-summary-card stat-item">
                        <div class="stat-value" id="totalAmount">¥0.00</div>
                        <div class="stat-label">总报销金额</div>
                    </div>
                    <div class="finance-summary-card stat-item">
                        <div class="stat-value" id="pendingAmount">¥0.00</div>
                        <div class="stat-label">待审核金额</div>
                    </div>
                    <div class="finance-summary-card stat-item">
                        <div class="stat-value" id="paidAmount">¥0.00</div>
                        <div class="stat-label">已打款金额</div>
                    </div>
                </div>

                <div class="finance-chart-grid">
                    <div class="layui-card finance-card-shell">
                        <div class="layui-card-header">月度报销趋势</div>
                        <div class="layui-card-body">
                            <div id="monthlyChart" class="finance-chart-panel"></div>
                        </div>
                    </div>
                    <div class="layui-card finance-card-shell">
                        <div class="layui-card-header">部门报销分布</div>
                        <div class="layui-card-body">
                            <div id="departmentChart" class="finance-chart-panel"></div>
                        </div>
                    </div>
                </div>

                <div class="layui-card finance-card-shell finance-stat-table">
                    <div class="layui-card-header">报销明细</div>
                    <div class="layui-card-body">
                        <table id="reimbursementDetailTable" class="layui-table" lay-filter="reimbursementDetailTable"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'layui/layui.js' %}"></script>
    <script>
        layui.use(['table', 'layer'], function() {
            var table = layui.table;
            var layer = layui.layer;

            // 加载统计数据
            function loadStatistics() {
                // 从后端API获取统计数据
                $.ajax({
                    url: '/adm/finance/reimbursement/statistics/',
                    method: 'GET',
                    dataType: 'json',
                    success: function(data) {
                        $('#totalReimbursement').text(data.total_reimbursement || 0);
                        $('#totalAmount').text('¥' + (data.total_amount || 0).toLocaleString('zh-CN', {minimumFractionDigits: 2}));
                        $('#pendingAmount').text('¥' + (data.pending_amount || 0).toLocaleString('zh-CN', {minimumFractionDigits: 2}));
                        $('#paidAmount').text('¥' + (data.paid_amount || 0).toLocaleString('zh-CN', {minimumFractionDigits: 2}));
                    },
                    error: function() {
                        console.error('获取报销统计数据失败');
                    }
                });
            }

            // 初始化详细数据表格
            table.render({
                elem: '#reimbursementDetailTable',
                url: '/adm/finance/reimbursement/datalist/',
                cols: [[
                    {field: 'code', title: '报销编码', width: 150},
                    {field: 'cost', title: '报销金额', width: 120},
                    {field: 'admin_name', title: '报销人', width: 100},
                    {field: 'check_status', title: '审核状态', width: 100},
                    {field: 'pay_status', title: '打款状态', width: 100},
                    {field: 'create_time', title: '创建时间', width: 180}
                ]],
                page: true,
                limit: 10,
                height: 400
            });

            // 页面加载时获取统计数据
            loadStatistics();
        });
    </script>
</body>
</html>
