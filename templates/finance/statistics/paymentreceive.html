{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收款统计</title>
    <link rel="stylesheet" href="{% static 'layui/css/layui.css' %}">
    <link rel="stylesheet" href="{% static 'css/dtcall-ui.css' %}">
    <link rel="stylesheet" href="{% static 'css/finance-module.css' %}">
    <style>
        .stat-item {
            min-width: 0;
            text-align: center;
            padding: 16px;
        }
        .stat-value {
            font-size: 26px;
            font-weight: bold;
            color: #172033;
        }
        .stat-label {
            font-size: 13px;
            color: #5b6b80;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="layui-fluid finance-shell">
        <div class="finance-page-header">
            <div>
                <h1 class="finance-page-title">收款统计</h1>
                <p class="finance-page-subtitle">跟踪回款笔数、金额和登记节奏，核对发票与回款闭环。</p>
            </div>
        </div>
        <div class="layui-card finance-card-shell">
            <div class="layui-card-header">收款统计分析</div>
            <div class="layui-card-body">
                <div class="finance-stat-grid">
                    <div class="finance-summary-card stat-item">
                        <div class="stat-value" id="totalPaymentReceive">0</div>
                        <div class="stat-label">总收款笔数</div>
                    </div>
                    <div class="finance-summary-card stat-item">
                        <div class="stat-value" id="totalAmount">¥0.00</div>
                        <div class="stat-label">总收款金额</div>
                    </div>
                    <div class="finance-summary-card stat-item">
                        <div class="stat-value" id="thisMonthAmount">¥0.00</div>
                        <div class="stat-label">本月收款</div>
                    </div>
                    <div class="finance-summary-card stat-item">
                        <div class="stat-value" id="avgAmount">¥0.00</div>
                        <div class="stat-label">平均收款</div>
                    </div>
                </div>

                <div class="layui-card finance-card-shell finance-stat-table">
                    <div class="layui-card-header">收款明细</div>
                    <div class="layui-card-body">
                        <table id="paymentReceiveDetailTable" class="layui-table" lay-filter="paymentReceiveDetailTable"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'layui/layui.js' %}"></script>
    <script>
        layui.use(['table', 'layer'], function() {
            var table = layui.table;
            var layer = layui.layer;

            // 加载统计数据
            function loadStatistics() {
                // 从后端API获取统计数据
                $.ajax({
                    url: '/adm/finance/paymentreceive/statistics/',
                    method: 'GET',
                    dataType: 'json',
                    success: function(data) {
                        $('#totalPaymentReceive').text(data.total_paymentreceive || 0);
                        $('#totalAmount').text('¥' + (data.total_amount || 0).toLocaleString('zh-CN', {minimumFractionDigits: 2}));
                        $('#thisMonthAmount').text('¥' + (data.this_month_amount || 0).toLocaleString('zh-CN', {minimumFractionDigits: 2}));
                        $('#avgAmount').text('¥' + (data.avg_amount || 0).toLocaleString('zh-CN', {minimumFractionDigits: 2}));
                    },
                    error: function() {
                        console.error('获取收款统计数据失败');
                    }
                });
            }

            // 初始化详细数据表格
            table.render({
                elem: '#paymentReceiveDetailTable',
                url: '/adm/finance/paymentreceive/datalist/',
                cols: [[
                    {field: 'invoice_code', title: '关联发票', width: 150},
                    {field: 'amount', title: '收款金额', width: 120},
                    {field: 'income_date', title: '收款日期', width: 120},
                    {field: 'remark', title: '备注', width: 200},
                    {field: 'create_time', title: '创建时间', width: 180}
                ]],
                page: true,
                limit: 10,
                height: 400
            });

            // 页面加载时获取统计数据
            loadStatistics();
        });
    </script>
</body>
</html>
