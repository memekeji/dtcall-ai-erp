{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收票统计</title>
    <link rel="stylesheet" href="{% static 'layui/css/layui.css' %}">
    <link rel="stylesheet" href="{% static 'css/dtcall-ui.css' %}">
    <link rel="stylesheet" href="{% static 'css/finance-module.css' %}">
    <style>
        .stat-item {
            min-width: 0;
            text-align: center;
            padding: 16px;
        }
        .stat-value {
            font-size: 26px;
            font-weight: bold;
            color: #172033;
        }
        .stat-label {
            font-size: 13px;
            color: #5b6b80;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="layui-fluid finance-shell">
        <div class="finance-page-header">
            <div>
                <h1 class="finance-page-title">收票统计</h1>
                <p class="finance-page-subtitle">集中查看收票数量、金额和处理状态，方便和采购付款链路对齐。</p>
            </div>
        </div>
        <div class="layui-card finance-card-shell">
            <div class="layui-card-header">收票统计分析</div>
            <div class="layui-card-body">
                <div class="finance-stat-grid">
                    <div class="finance-summary-card stat-item">
                        <div class="stat-value" id="totalReceiveInvoices">0</div>
                        <div class="stat-label">总收票数量</div>
                    </div>
                    <div class="finance-summary-card stat-item">
                        <div class="stat-value" id="totalAmount">¥0.00</div>
                        <div class="stat-label">总收票金额</div>
                    </div>
                    <div class="finance-summary-card stat-item">
                        <div class="stat-value" id="processedAmount">¥0.00</div>
                        <div class="stat-label">已处理金额</div>
                    </div>
                    <div class="finance-summary-card stat-item">
                        <div class="stat-value" id="pendingAmount">¥0.00</div>
                        <div class="stat-label">待处理金额</div>
                    </div>
                </div>

                <div class="layui-card finance-card-shell finance-stat-table">
                    <div class="layui-card-header">收票明细</div>
                    <div class="layui-card-body">
                        <table id="receiveInvoiceDetailTable" class="layui-table" lay-filter="receiveInvoiceDetailTable"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'layui/layui.js' %}"></script>
    <script>
        layui.use(['table', 'layer'], function() {
            var table = layui.table;
            var layer = layui.layer;

            // 加载统计数据
            function loadStatistics() {
                // 从后端API获取统计数据
                $.ajax({
                    url: '/adm/finance/receiveinvoice/statistics/',
                    method: 'GET',
                    dataType: 'json',
                    success: function(data) {
                        $('#totalReceiveInvoices').text(data.total_receive_invoices || 0);
                        $('#totalAmount').text('¥' + (data.total_amount || 0).toLocaleString('zh-CN', {minimumFractionDigits: 2}));
                        $('#processedAmount').text('¥' + (data.processed_amount || 0).toLocaleString('zh-CN', {minimumFractionDigits: 2}));
                        $('#pendingAmount').text('¥' + (data.pending_amount || 0).toLocaleString('zh-CN', {minimumFractionDigits: 2}));
                    },
                    error: function() {
                        console.error('获取收票统计数据失败');
                    }
                });
            }

            // 初始化详细数据表格
            table.render({
                elem: '#receiveInvoiceDetailTable',
                url: '/adm/finance/receiveinvoice/datalist/',
                cols: [[
                    {field: 'code', title: '发票号码', width: 150},
                    {field: 'amount', title: '发票金额', width: 120},
                    {field: 'invoice_title', title: '开票抬头', width: 200},
                    {field: 'open_time', title: '开票时间', width: 180},
                    {field: 'enter_status', title: '处理状态', width: 100}
                ]],
                page: true,
                limit: 10,
                height: 400
            });

            // 页面加载时获取统计数据
            loadStatistics();
        });
    </script>
</body>
</html>
