{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{% static 'layui/css/layui.css' %}">
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-card">
            <div class="layui-card-header">
                <div class="layui-row">
                    <div class="layui-col-md6">
                        <button class="layui-btn layui-btn-sm" onclick="openAdvancedForm('add')">
                            <i class="layui-icon layui-icon-add-1"></i> 新增{{ title }}
                        </button>
                    </div>
                    <div class="layui-col-md6" style="text-align: right;">
                        <div class="layui-inline">
                            <input type="text" id="keyword" class="layui-input" placeholder="请输入关键字">
                        </div>
                        <button class="layui-btn layui-btn-sm layui-btn-normal" onclick="reloadTable()">查询</button>
                    </div>
                </div>
            </div>
            <div class="layui-card-body">
                <table id="advancedTable" class="layui-table" lay-filter="advancedTable"></table>
            </div>
        </div>
    </div>

    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'layui/layui.js' %}"></script>
    <script>
        var moduleName = '{{ module }}';
        var titleName = '{{ title }}';
        var fieldTitles = {
            id: 'ID', name: '名称', account_type_display: '账户类型', bank_name: '开户银行', account_no: '账号', currency: '币种',
            opening_balance: '期初余额', current_balance: '当前余额', status_display: '状态', create_time: '创建时间', department_id: '部门ID',
            project_id: '项目ID', period_type_display: '预算周期', budget_amount: '预算金额', used_amount: '已用金额', remaining_amount: '剩余金额',
            usage_rate: '使用率', start_date: '开始日期', end_date: '结束日期', code: '编号', customer_id: '客户ID', order_id: '订单ID',
            invoice_id: '发票ID', amount: '金额', received_amount: '已收金额', due_date: '到期日期', supplier_id: '供应商ID', expense_id: '报销ID',
            paid_amount: '已付金额', account_name: '资金账户', transaction_date: '交易时间', direction_display: '收支方向', counterparty: '交易对方',
            transaction_no: '流水号', purpose: '用途', match_status_display: '匹配状态', related_type: '关联类型', related_id: '关联ID', period: '对账期间',
            book_balance: '账面余额', bank_balance: '银行余额', difference_amount: '差异金额', reconciled_by: '对账人ID', reconciled_time: '对账时间',
            voucher_no: '凭证号', voucher_date: '凭证日期', summary: '摘要', debit_amount: '借方金额', credit_amount: '贷方金额', source_type: '来源类型',
            source_id: '来源ID', posted_by: '过账人ID', posted_time: '过账时间', account_type_display: '科目类型', level: '科目级次',
            is_leaf: '是否末级', balance_direction_display: '余额方向', voucher_no: '凭证号', account_code: '科目编码', account_name: '科目名称',
            auxiliary_type: '辅助核算类型', auxiliary_id: '辅助核算ID', tax_type_display: '税种', taxable_amount: '计税金额',
            tax_rate: '税率', tax_amount: '税额', asset_code: '资产编号', category: '资产类别', original_value: '原值',
            accumulated_depreciation: '累计折旧', net_value: '净值', monthly_depreciation: '月折旧额', allocation_no: '分摊编号',
            allocation_basis: '分摊依据', income_amount: '收入金额', expense_amount: '费用金额', profit_amount: '利润金额', closed_by: '结账人ID',
            plan_no: '计划编号', flow_type_display: '流向', expected_date: '预计日期', expected_amount: '预计金额', actual_amount: '实际金额',
            variance_amount: '差异金额', ratio_type_display: '指标类型', value: '指标值', target_value: '目标值', warning_value: '预警值', unit: '单位',
            accrual_no: '计提编号', expense_type: '费用类型', accrued_by: '计提人ID', accrued_time: '计提时间', closed_time: '结账时间', report_no: '报表编号', report_type_display: '报表类型', total_assets: '资产总额', total_liabilities: '负债总额',
            total_equity: '权益总额', revenue_amount: '收入金额', cost_amount: '成本费用'
        };
        var fields = [{% for field in fields %}'{{ field }}'{% if not forloop.last %}, {% endif %}{% endfor %}];

        layui.use(['table', 'layer'], function() {
            var table = layui.table;
            window.layer = layui.layer;
            var cols = fields.map(function(field) {
                return {field: field, title: fieldTitles[field] || field, minWidth: field === 'summary' || field === 'purpose' ? 180 : 120};
            });
            cols.push({title: '操作', width: 130, fixed: 'right', toolbar: '#advancedToolBar'});

            table.render({
                elem: '#advancedTable',
                url: '/adm/finance/advanced/' + moduleName + '/datalist/',
                cols: [cols],
                page: true,
                limit: 20,
                height: 'full-170'
            });

            table.on('tool(advancedTable)', function(obj) {
                if (obj.event === 'edit') {
                    openAdvancedForm('edit', obj.data.id);
                    return;
                }
                if (obj.event === 'delete') {
                    layer.confirm('确定删除该' + titleName + '记录吗？', function(index) {
                        $.ajax({
                            url: '/adm/finance/advanced/' + moduleName + '/del/',
                            type: 'POST',
                            data: JSON.stringify({id: obj.data.id}),
                            contentType: 'application/json',
                            headers: {'X-CSRFToken': $('meta[name="csrf-token"]').attr('content')},
                            success: function(response) {
                                if (response.code === 0) {
                                    layer.msg('删除成功', {icon: 1});
                                    table.reload('advancedTable');
                                } else {
                                    layer.msg(response.msg || '删除失败', {icon: 2});
                                }
                            }
                        });
                        layer.close(index);
                    });
                }
            });
        });

        function reloadTable() {
            layui.table.reload('advancedTable', {where: {keyword: $('#keyword').val()}, page: {curr: 1}});
        }

        function openAdvancedForm(type, id) {
            var url = '/adm/finance/advanced/' + moduleName + '/' + (type === 'add' ? 'add/' : 'edit/' + id + '/');
            layer.open({
                type: 2,
                title: (type === 'add' ? '新增' : '编辑') + titleName,
                shadeClose: false,
                shade: 0.3,
                maxmin: true,
                area: ['80%', '100%'],
                offset: 'r',
                anim: 2,
                content: url,
                success: function(layero) {
                    layero.css({'right': '0', 'top': '0', 'height': '100%'});
                },
                end: function() {
                    layui.table.reload('advancedTable');
                }
            });
        }
    </script>
    <script type="text/html" id="advancedToolBar">
        <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
        <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</a>
    </script>
</body>
</html>
