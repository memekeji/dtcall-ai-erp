{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>付款管理</title>
    <link rel="stylesheet" href="{% static 'layui/css/layui.css' %}">
    <link rel="stylesheet" href="{% static 'css/dtcall-ui.css' %}">
    <link rel="stylesheet" href="{% static 'css/finance-module.css' %}">
</head>
<body>
<div class="layui-fluid finance-shell">
    <div class="finance-page-header">
        <div>
            <h1 class="finance-page-title">付款管理</h1>
            <p class="finance-page-subtitle">支持报销、客户、订单、采购订单、采购合同和项目多源关联，至少关联一项业务对象。</p>
        </div>
    </div>

    <div class="finance-summary-grid">
        <div class="finance-summary-card">
            <div class="finance-summary-label">付款记录</div>
            <div class="finance-summary-value" id="paymentCount">0</div>
            <div class="finance-summary-note">符合当前筛选</div>
        </div>
        <div class="finance-summary-card">
            <div class="finance-summary-label">付款总额</div>
            <div class="finance-summary-value" id="paymentAmount">¥0.00</div>
            <div class="finance-summary-note">当前结果汇总</div>
        </div>
        <div class="finance-summary-card">
            <div class="finance-summary-label">已关联合同/订单</div>
            <div class="finance-summary-value" id="paymentLinked">0</div>
            <div class="finance-summary-note">含订单或采购合同</div>
        </div>
        <div class="finance-summary-card">
            <div class="finance-summary-label">客户独立付款</div>
            <div class="finance-summary-value" id="paymentCustomerOnly">0</div>
            <div class="finance-summary-note">仅客户维度登记</div>
        </div>
    </div>

    <div class="layui-card finance-card-shell">
        <div class="layui-card-header">
            <div class="finance-toolbar">
                <div class="finance-toolbar-left">
                    <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="addPaymentBtn">
                        <i class="layui-icon layui-icon-add-1"></i> 新增付款
                    </button>
                    <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="refreshBtn">
                        <i class="layui-icon layui-icon-refresh"></i> 刷新
                    </button>
                </div>
                <div class="finance-toolbar-right">
                    <div class="finance-filter-row">
                        <input type="text" id="keywordInput" placeholder="客户 / 订单 / 报销 / 备注" class="layui-input" style="width: 260px;">
                        <button type="button" class="layui-btn layui-btn-sm" id="searchBtn">
                            <i class="layui-icon layui-icon-search"></i> 搜索
                        </button>
                        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="resetBtn">
                            <i class="layui-icon layui-icon-refresh-3"></i> 重置
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-card-body">
            <table id="paymentTable" lay-filter="paymentTable"></table>
        </div>
    </div>
</div>

<script src="{% static 'js/jquery.min.js' %}"></script>
<script src="{% static 'layui/layui.js' %}"></script>
<script type="text/html" id="paymentToolBar">
    <a class="layui-btn layui-btn-xs" lay-event="view">详情</a>
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</a>
</script>
<script>
    layui.use(["table", "layer"], function () {
        const table = layui.table;
        const layer = layui.layer;
        const financeBase = window.location.pathname.startsWith("/adm/") ? "/adm/finance" : "/finance";

        function openDrawer(url, title, endCallback) {
            layer.open({
                type: 2,
                title: title,
                shadeClose: false,
                shade: 0.28,
                maxmin: true,
                area: ["82%", "100%"],
                offset: "r",
                anim: 2,
                content: financeBase + url,
                success: function (layero) {
                    layero.css({ right: "0", top: "0", height: "100%" });
                },
                end: function () {
                    if (typeof endCallback === "function") {
                        endCallback();
                    }
                }
            });
        }

        function escapeHtml(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function relationCell(d) {
            return d.relation_summary
                ? "<div>" + escapeHtml(d.relation_summary) + "</div>"
                : '<span class="finance-empty-text">未关联业务对象</span>';
        }

        function updateSummary(rows, totalCount) {
            const amount = rows.reduce((sum, item) => sum + Number(item.amount || 0), 0);
            const linked = rows.filter(item => item.order_id || item.purchase_order_id || item.purchase_contract_id).length;
            const customerOnly = rows.filter(item => item.customer_id && !item.expense_id && !item.order_id && !item.purchase_order_id && !item.purchase_contract_id && !item.project_id).length;
            $("#paymentCount").text(totalCount || 0);
            $("#paymentAmount").text("¥" + amount.toFixed(2));
            $("#paymentLinked").text(linked);
            $("#paymentCustomerOnly").text(customerOnly);
        }

        function renderTable(resetPage) {
            table.render({
                elem: "#paymentTable",
                id: "paymentTable",
                url: financeBase + "/payment/datalist/",
                where: {
                    keywords: $("#keywordInput").val().trim()
                },
                page: true,
                limit: 20,
                height: "full-320",
                cols: [[
                    { field: "id", title: "ID", width: 80, align: "center", fixed: "left" },
                    { field: "relation_summary", title: "业务关联", minWidth: 320, templet: relationCell },
                    { field: "customer_name", title: "客户", width: 160 },
                    { field: "amount", title: "付款金额", width: 120, templet: d => "¥" + Number(d.amount || 0).toFixed(2) },
                    { field: "payment_date", title: "付款日期", width: 170, align: "center" },
                    { field: "remark", title: "备注", minWidth: 180 },
                    { field: "create_time", title: "创建时间", width: 160, align: "center", templet: d => d.create_time || "-" },
                    { title: "操作", width: 120, toolbar: "#paymentToolBar", fixed: "right" }
                ]],
                page: resetPage ? { curr: 1 } : true,
                done: function (res) {
                    updateSummary(res.data || [], res.count);
                }
            });
        }

        function reloadTable(resetPage) {
            table.reload("paymentTable", {
                where: { keywords: $("#keywordInput").val().trim() },
                page: resetPage ? { curr: 1 } : undefined
            });
        }

        $("#addPaymentBtn").on("click", function () {
            openDrawer("/payment/add/", "新增付款", () => reloadTable());
        });
        $("#refreshBtn").on("click", function () { reloadTable(); });
        $("#searchBtn").on("click", function () { reloadTable(true); });
        $("#resetBtn").on("click", function () {
            $("#keywordInput").val("");
            reloadTable(true);
        });

        table.on("tool(paymentTable)", function (obj) {
            const data = obj.data;
            if (obj.event === "view") {
                openDrawer("/payment/view/" + data.id + "/", "付款详情");
            } else if (obj.event === "delete") {
                layer.confirm("确定删除这条付款记录吗？", function (index) {
                    $.ajax({
                        url: financeBase + "/payment/del/",
                        type: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({ id: data.id }),
                        success: function (res) {
                            if (res.code === 0) {
                                layer.msg("删除成功", { icon: 1 });
                                reloadTable();
                            } else {
                                layer.msg(res.msg || "删除失败", { icon: 2 });
                            }
                        }
                    });
                    layer.close(index);
                });
            }
        });

        renderTable();
    });
</script>
</body>
</html>
