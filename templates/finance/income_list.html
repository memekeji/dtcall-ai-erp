{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收入管理</title>
    <link rel="stylesheet" href="{% static 'layui/css/layui.css' %}">
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-card">
            <div class="layui-card-header">
                <div class="layui-btn-group">
                    <button class="layui-btn layui-btn-sm" onclick="addIncome()">
                        <i class="layui-icon layui-icon-add-1"></i> 新增收入
                    </button>
                </div>
            </div>
            <div class="layui-card-body">
                <table id="incomeTable" class="layui-table" lay-filter="incomeTable"></table>
            </div>
        </div>
    </div>

    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'layui/layui.js' %}"></script>
    <script>
        layui.use(['table', 'layer'], function() {
            var table = layui.table;
            var layer = layui.layer;

            // 初始化表格
            table.render({
                elem: '#incomeTable',
                url: '/adm/finance/income/datalist/',
                cols: [[
                    {field: 'id', title: 'ID', width: 80},
                    {field: 'invoice_code', title: '关联发票', width: 180, templet: function(d) {
                        return d.invoice_code || ('发票ID：' + d.invoice_id);
                    }},
                    {field: 'invoice_title', title: '开票抬头', minWidth: 180},
                    {field: 'amount', title: '收入金额', width: 120},
                    {field: 'income_date', title: '收入日期', width: 180},
                    {field: 'remark', title: '备注', width: 200},
                    {field: 'create_time', title: '创建时间', width: 180},
                    {title: '操作', width: 100, toolbar: '#incomeToolBar'}
                ]],
                page: true,
                limit: 20,
                height: 'full-200'
            });

            // 监听工具条
            table.on('tool(incomeTable)', function(obj) {
                var data = obj.data;
                var layEvent = obj.event;

                if (layEvent === 'delete') {
                    layer.confirm('确定删除这条收入记录吗？', function(index) {
                        $.ajax({
                            url: '/adm/finance/income/del/',
                            type: 'POST',
                            data: JSON.stringify({id: data.id}),
                            contentType: 'application/json',
                            success: function(response) {
                                if (response.code === 0) {
                                    layer.msg('删除成功', {icon: 1});
                                    table.reload('incomeTable');
                                } else {
                                    layer.msg(response.msg, {icon: 2});
                                }
                            }
                        });
                        layer.close(index);
                    });
                }
            });
        });

        // 新增收入
        function addIncome() {
            layer.open({
                type: 2,
                title: '新增收入',
                shadeClose: false,
                shade: 0.3,
                maxmin: true,
                area: ['80%', '100%'],
                offset: 'r',
                anim: 2,
                content: '/adm/finance/income/add/',
                success: function(layero, index) {
                    if (layero && typeof layero.css === 'function') {
                        layero.css({
                            'right': '0',
                            'top': '0',
                            'height': '100%'
                        });
                    }
                },
                end: function() {
                    layui.table.reload('incomeTable');
                }
            });
        }

    </script>

    <!-- 工具栏模板 -->
    <script type="text/html" id="incomeToolBar">
        <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</a>
    </script>
</body>
</html>
