{% extends 'include/popup.html' %}
{% load static %}

{% block title %}{% if purchase %}编辑采购合同{% else %}新增采购合同{% endif %}{% endblock %}

{% block head %}
{% endblock %}

{% block content %}
    <div class="layui-fluid" style="padding: 20px;">
        <form class="layui-form" lay-filter="purchaseForm">
            {% csrf_token %}
            {% if purchase %}<input type="hidden" name="id" value="{{ purchase.id }}">{% endif %}
            <div class="layui-row layui-col-space15">
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">采购编号</label>
                        <div class="layui-input-block">
                            <input type="text" name="code" value="{{ purchase.code|default:'' }}" placeholder="请输入采购编号" class="layui-input" lay-verify="required">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">采购名称</label>
                        <div class="layui-input-block">
                            <input type="text" name="name" value="{{ purchase.name|default:'' }}" placeholder="请输入采购名称" class="layui-input" lay-verify="required">
                        </div>
                    </div>
                </div>
            </div>

            <div class="layui-row layui-col-space15">
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">采购分类</label>
                        <div class="layui-input-block">
                            <select name="cate_id" lay-verify="required">
                                <option value="">请选择采购分类</option>
                                {% for category in contract_categories %}
                                <option value="{{ category.id }}" {% if purchase and purchase.cate_id == category.id %}selected{% endif %}>{{ category.title }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">采购金额</label>
                        <div class="layui-input-block">
                            <input type="number" name="amount" value="{{ purchase.amount|default:'' }}" placeholder="请输入采购金额" class="layui-input" lay-verify="required|number" step="0.01">
                        </div>
                    </div>
                </div>
            </div>

            <div class="layui-row layui-col-space15">
                <div class="layui-col-md4">
                    <div class="layui-form-item">
                        <label class="layui-form-label">签订时间</label>
                        <div class="layui-input-block">
                            <input type="text" name="sign_time" value="{% if purchase and purchase.sign_time %}{{ purchase.sign_time|date:'Y-m-d' }}{% endif %}" placeholder="请选择签订时间" class="layui-input" id="signTime" lay-verify="required">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md4">
                    <div class="layui-form-item">
                        <label class="layui-form-label">开始时间</label>
                        <div class="layui-input-block">
                            <input type="text" name="start_time" value="{% if purchase and purchase.start_time %}{{ purchase.start_time|date:'Y-m-d' }}{% endif %}" placeholder="请选择开始时间" class="layui-input" id="startTime" lay-verify="required">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md4">
                    <div class="layui-form-item">
                        <label class="layui-form-label">结束时间</label>
                        <div class="layui-input-block">
                            <input type="text" name="end_time" value="{% if purchase and purchase.end_time %}{{ purchase.end_time|date:'Y-m-d' }}{% endif %}" placeholder="请选择结束时间" class="layui-input" id="endTime" lay-verify="required">
                        </div>
                    </div>
                </div>
            </div>

            <div class="layui-row layui-col-space15">
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">采购类型</label>
                        <div class="layui-input-block">
                            <select name="types" lay-verify="required">
                                <option value="0" {% if not purchase or purchase.types == 0 %}selected{% endif %}>普通采购</option>
                                <option value="1" {% if purchase and purchase.types == 1 %}selected{% endif %}>框架采购</option>
                                <option value="2" {% if purchase and purchase.types == 2 %}selected{% endif %}>紧急采购</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">编制人</label>
                        <div class="layui-input-block">
                            <select name="prepared_uid">
                                <option value="">默认当前用户</option>
                                {% for admin in admin_users %}
                                <option value="{{ admin.id }}" {% if purchase and purchase.prepared_uid_id == admin.id %}selected{% endif %}>{{ admin.name|default:admin.username }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="layui-row layui-col-space15">
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">签订人</label>
                        <div class="layui-input-block">
                            <select name="sign_uid">
                                <option value="">默认当前用户</option>
                                {% for admin in admin_users %}
                                <option value="{{ admin.id }}" {% if purchase and purchase.sign_uid_id == admin.id %}selected{% endif %}>{{ admin.name|default:admin.username }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">保管人</label>
                        <div class="layui-input-block">
                            <select name="keeper_uid">
                                <option value="">默认当前用户</option>
                                {% for admin in admin_users %}
                                <option value="{{ admin.id }}" {% if purchase and purchase.keeper_uid_id == admin.id %}selected{% endif %}>{{ admin.name|default:admin.username }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">备注信息</label>
                <div class="layui-input-block">
                    <textarea name="remark" placeholder="请输入备注信息" class="layui-textarea">{{ purchase.remark|default:'' }}</textarea>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn" lay-submit lay-filter="submitPurchase">{% if purchase %}保存修改{% else %}立即提交{% endif %}</button>
                    <button type="button" class="layui-btn layui-btn-primary" onclick="closePopup()">取消</button>
                </div>
            </div>
        </form>
    </div>
{% endblock %}

{% block script %}
    <script>
        layui.use(['form', 'laydate', 'layer'], function() {
            var form = layui.form;
            var laydate = layui.laydate;
            var layer = layui.layer;
            var purchaseId = {% if purchase %}{{ purchase.id }}{% else %}null{% endif %};
            var submitUrl = purchaseId ? '/contract/purchase/update/' + purchaseId + '/' : '/contract/purchase/add/';
            var successMessage = purchaseId ? '修改成功' : '添加成功';

            form.render();

            laydate.render({
                elem: '#signTime',
                format: 'yyyy-MM-dd'
            });

            laydate.render({
                elem: '#startTime',
                format: 'yyyy-MM-dd'
            });

            laydate.render({
                elem: '#endTime',
                format: 'yyyy-MM-dd'
            });

            form.on('submit(submitPurchase)', function(data) {
                var formData = data.field;

                if (formData.end_time <= formData.start_time) {
                    layer.msg('结束时间必须大于开始时间', {icon: 2});
                    return false;
                }

                $.ajax({
                    url: submitUrl,
                    type: 'POST',
                    data: formData,
                    success: function(response) {
                        if (response.code === 0) {
                            layer.msg(successMessage, {icon: 1}, function() {
                                if (window.parent && window.parent.layui && window.parent.layui.table) {
                                    window.parent.layui.table.reload('purchaseTable');
                                }
                                closePopup();
                            });
                        } else {
                            layer.msg(response.msg, {icon: 2});
                        }
                    },
                    error: function() {
                        layer.msg('网络错误，请重试', {icon: 2});
                    }
                });

                return false;
            });
        });
    </script>
{% endblock %}
