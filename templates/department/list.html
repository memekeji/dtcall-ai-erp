{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>部门管理</title>
    <link rel="stylesheet" href="{% static 'layui/css/layui.css' %}">
    <link rel="stylesheet" href="{% static 'css/common.css' %}">
    <style>
        .layui-container {
            width: 100% !important;
            max-width: none !important;
            height: 100%;
            padding: 0;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow-x: hidden;
            overflow-y: hidden;
            background: #f4f7fb;
        }
        .layui-row,
        .layui-col-md12 {
            height: 100%;
        }
        .department-layout {
            display: flex;
            gap: 12px;
            height: calc(100vh - 138px);
            padding: 12px 16px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .department-sidebar {
            width: 188px;
            flex: 0 0 188px;
            display: flex;
            flex-direction: column;
            min-width: 0;
            border: 1px solid #e5edf7;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
            overflow: hidden;
        }
        .department-sidebar-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 12px;
            border-bottom: 1px solid #eef3f8;
            background: #fbfdff;
        }
        .department-sidebar-head strong {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
        }
        .department-sidebar-head span {
            font-size: 12px;
            color: #64748b;
        }
        .tree-box {
            flex: 1 1 auto;
            min-height: 0;
            padding: 10px 8px 12px 12px;
            overflow-y: auto;
        }
        .content-box {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #e5edf7;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.05);
            overflow: hidden;
        }
        .department-toolbar {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 2px 2px 10px;
        }
        .department-toolbar-main {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
        }
        .department-toolbar-copy {
            min-width: 0;
        }
        .department-toolbar-eyebrow {
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #2563eb;
            letter-spacing: 0;
        }
        .department-toolbar-copy h2 {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 18px;
            line-height: 1.2;
            color: #0f172a;
        }
        .department-toolbar-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }
        .department-meta-chip {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 0 12px;
            border-radius: 14px;
            background: #f7f9fc;
            border: 1px solid #e5edf7;
            font-size: 12px;
            color: #64748b;
        }
        .department-title-scope {
            min-height: 26px;
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid #dbe7fb;
            background: #f4f8ff;
            color: #2563eb;
            font-size: 12px;
            font-weight: 600;
        }
        .department-meta-chip.is-focus {
            border-color: #dbe7fb;
            background: #f4f8ff;
            color: #2563eb;
            font-weight: 600;
        }
        .department-toolbar-stats {
            flex: 0 0 auto;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .department-stat-inline {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 30px;
            padding: 0 12px;
            border-radius: 14px;
            border: 1px solid #e5edf7;
            background: #f7f9fc;
            color: #475569;
        }
        .department-stat-inline em {
            font-style: normal;
            font-size: 12px;
            color: #64748b;
        }
        .department-stat-inline strong {
            font-size: 15px;
            line-height: 1;
            color: #0f172a;
        }
        .department-toolbar-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border: 1px solid #e6edf7;
            border-radius: 16px;
            background: #fbfdff;
            flex-wrap: wrap;
        }
        .toolbar-filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid #e0e8f3;
            background: #fff;
        }
        .toolbar-filter-chip label {
            margin: 0;
            font-size: 12px;
            font-weight: 700;
            color: #334155;
            white-space: nowrap;
        }
        .toolbar-filter-chip .layui-input-inline {
            width: 138px !important;
            margin: 0;
        }
        .toolbar-search {
            flex: 1 1 260px;
            min-width: 220px;
            max-width: 940px;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 40px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid #e0e8f3;
            background: #fff;
        }
        .toolbar-search i {
            color: #94a3b8;
            font-size: 16px;
        }
        .toolbar-search input {
            flex: 1 1 auto;
            border: none;
            background: transparent;
            outline: none;
            font-size: 13px;
            color: #0f172a;
        }
        .toolbar-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .toolbar-btn {
            height: 38px;
            padding: 0 16px;
            border-radius: 12px;
            font-weight: 600;
            line-height: 38px;
        }
        .toolbar-btn.layui-btn-primary {
            color: #475569;
            border-color: #d6dfeb;
            background: #fff;
        }
        .toolbar-btn.layui-btn-normal {
            background: #1677ff;
            box-shadow: none;
        }
        .department-table-shell {
            flex: 1 1 auto;
            min-height: 0;
            padding: 0 4px 4px;
            overflow: hidden;
        }
        .department-table-shell .layui-table-view {
            margin: 0;
            border-radius: 16px 16px 14px 14px;
            overflow: hidden;
            border-color: #e5edf7;
        }
        .department-table-shell .layui-table-header th {
            background: #f9fbff;
            color: #334155;
            font-weight: 700;
        }
        .department-table-shell .layui-table-body tr:hover,
        .department-table-shell .layui-table-hover {
            background: #f8fbff;
        }
        .department-table-shell .layui-table-cell {
            height: auto !important;
            padding: 5px 10px;
            line-height: 1.45;
            white-space: normal;
        }
        .department-table-shell .layui-table-page {
            height: 50px;
            padding-top: 8px;
            border-top: 1px solid #edf2f7;
        }
        .status-active { background-color: #52c41a; }
        .status-inactive { background-color: #ff4d4f; }
        .table-inline-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .table-inline-actions .layui-btn {
            margin: 0;
            border-radius: 4px;
        }
        .department-name {
            display: flex;
            align-items: center;
            color: #0f172a;
        }
        .department-title {
            font-weight: 600;
            color: #333;
            flex: 1;
            display: flex;
            align-items: center;
        }
        .department-level-1 {
            padding-left: 0px;
        }
        .department-level-2 {
            padding-left: 20px;
        }
        .department-level-3 {
            padding-left: 40px;
        }
        .department-level-4 {
            padding-left: 60px;
        }
        .department-level-5 {
            padding-left: 80px;
        }
        .department-level-6 {
            padding-left: 100px;
        }
        .level-indicator {
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-right: 8px;
            position: relative;
        }
        .level-indicator::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background-color: #666;
            border-radius: 50%;
        }
        .level-indicator.has-children::before {
            background-color: #1890ff;
            width: 6px;
            height: 6px;
        }
        .slide-panel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9998;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .slide-panel-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .slide-panel-wrapper {
            position: fixed;
            top: 0;
            right: -75%;
            width: 75%;
            height: 100%;
            background: white;
            box-shadow: -2px 0 20px rgba(0, 0, 0, 0.1);
            z-index: 9999;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        /* 修复layer提示框被遮罩的问题 */
        .layui-layer {
            z-index: 20000 !important;
        }
        
        .layui-layer-shade {
            z-index: 19999 !important;
        }
        
        .layui-layer-content {
            z-index: 20000 !important;
        }
        
        .slide-panel-wrapper.active {
            right: 0;
        }
        
        .slide-panel-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .slide-panel-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin: 0;
        }
        
        .slide-panel-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #666;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        
        .slide-panel-close:hover {
            background: #e9ecef;
        }
        
        .slide-panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }
        
        .slide-panel-body {
            padding: 20px;
            height: 100%;
        }
        
        body.slide-panel-open {
            overflow: hidden;
        }
        #departmentTree .layui-tree-entry {
            min-height: 30px;
            border-radius: 8px;
        }
        #departmentTree .layui-tree-txt {
            font-size: 13px;
            color: #334155;
        }
        #departmentTree .layui-tree-pack {
            padding-left: 18px;
        }
        @media (max-width: 1360px) {
            .department-toolbar-main {
                flex-direction: column;
                align-items: stretch;
            }
            .department-toolbar-stats,
            .toolbar-actions {
                margin-left: 0;
                justify-content: flex-start;
            }
        }
        @media (max-width: 1080px) {
            .department-layout {
                gap: 12px;
                padding: 12px;
            }
            .department-sidebar {
                width: 168px;
                flex-basis: 168px;
            }
            .toolbar-search {
                flex-basis: 200px;
                min-width: 200px;
            }
        }
        @media (max-width: 768px) {
            html,
            body {
                overflow-y: auto;
            }
            .layui-container,
            .layui-row,
            .layui-col-md12 {
                height: auto;
            }
            .department-layout {
                flex-direction: column;
                height: auto;
                min-height: calc(100vh - 138px);
                overflow: visible;
            }
            .department-sidebar {
                width: 100%;
                flex-basis: auto;
                max-height: 220px;
            }
            .content-box {
                min-height: 520px;
            }
            .department-toolbar-main {
                flex-direction: column;
                align-items: stretch;
            }
            .department-toolbar-copy h2 {
                align-items: flex-start;
            }
            .department-toolbar-stats {
                justify-content: flex-start;
            }
            .toolbar-search {
                min-width: 100%;
                flex-basis: 100%;
            }
            .toolbar-actions {
                margin-left: 0;
                width: 100%;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    {% csrf_token %}
    <div class="layui-container">
        <div class="layui-row">
            <div class="layui-col-md12">
                <div class="department-layout">
                    <aside class="department-sidebar">
                        <div class="department-sidebar-head">
                            <strong>组织树</strong>

                                    <h2>
                                        部门管理
                                        <span class="department-meta-chip department-title-scope" id="departmentScopeLabel">当前范围：全部部门</span>

                                </div>
                                <div class="department-toolbar-stats">
                                    <span class="department-stat-inline"><em>本页</em><strong id="departmentVisibleCount">0</strong></span>
                                    <span class="department-stat-inline"><em>结果</em><strong id="departmentTotalCount">0</strong></span>
                                </div>

                            <div class="department-toolbar-controls layui-form">

                                <div class="toolbar-search">

                                    <input type="text" id="departmentKeywordFilter" name="keyword" placeholder="搜索部门名称、负责人或上级部门">

                                <div class="toolbar-actions">
                                    <button type="button" class="layui-btn layui-btn-primary toolbar-btn" id="resetBtn">重置</button>
                                    <button type="button" class="layui-btn layui-btn-primary toolbar-btn" id="searchBtn">搜索</button>
                                    <button type="button" class="layui-btn layui-btn-normal toolbar-btn" id="addBtn">添加部门</button>

                        <div class="department-table-shell">

                    </section>
                </div>
            </div>
        </div>
    </div>

    <!-- 新版弹窗容器 - 完全独立DOM树 -->
    <div id="slidePanelContainer">
        <div class="slide-panel-overlay" id="slidePanelOverlay"></div>
        <div class="slide-panel-wrapper" id="slidePanelWrapper">
            <div class="slide-panel-header">
                <h3 class="slide-panel-title" id="panelTitle">部门信息</h3>
                <button class="slide-panel-close" id="slidePanelClose">×</button>
            </div>
            <div class="slide-panel-content">
                <div class="slide-panel-body" id="slidePanelContent"></div>
            </div>
        </div>
    </div>

    <script type="text/html" id="barTpl">

    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'layui/layui.js' %}"></script>
    <script src="{% static 'js/common.js' %}"></script>
    <script>
        function closeSlidePanel() {
            var $overlay = $('#slidePanelOverlay');
            var $panel = $('#slidePanelWrapper');
            var $content = $('#slidePanelContent');
            var $body = $('body');

            $overlay.removeClass('active');
            $panel.removeClass('active');
            $body.removeClass('slide-panel-open');

            if ($content.length) {
                $content.empty();
            }

            var scrollPos = $body.data('scroll-pos');
            if (scrollPos !== undefined) {
                $(window).scrollTop(scrollPos);
                $body.removeData('scroll-pos');
            }
        }

        // 获取CSRF令牌的辅助函数
        var getCookie = (window.DTCallCommon && window.DTCallCommon.getCookie) || function(name) {
            var cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                var cookies = document.cookie.split(';');
                for (var i = 0; i < cookies.length; i++) {
                    var cookie = jQuery.trim(cookies[i]);
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        };

        // 从DOM或cookie获取CSRF令牌
        function getCsrfToken() {
            var input = document.querySelector('input[name=csrfmiddlewaretoken]');
            if (input) {
                return input.value;
            }
            return getCookie('csrftoken');
        }


        // 设置全局AJAX请求头，包含CSRF令牌
        $.ajaxSetup({
            beforeSend: function(xhr) {
                xhr.setRequestHeader('X-CSRFToken', getCsrfToken());
            }
        });

        layui.use(['tree', 'table', 'form', 'layer'], function() {
            var tree = layui.tree;
            var table = layui.table;
            var form = layui.form;
            var layer = layui.layer;
            var currentFilters = {
                parentId: null,
                parentName: '全部部门',
                status: '',
                keyword: ''
            };
            var resizeTimer = null;

            function syncWorkspaceHeight() {
                var layout = document.querySelector('.department-layout');
                if (!layout) {
                    return;
                }
                if (window.innerWidth <= 768) {
                    layout.style.height = 'auto';
                    return;
                }

                var rect = layout.getBoundingClientRect();
                var bottomOffset = 12;
                var availableHeight = window.innerHeight - rect.top - bottomOffset;
                layout.style.height = Math.max(520, Math.floor(availableHeight)) + 'px';
            }

            function getTableHeight() {
                var shell = document.querySelector('.department-table-shell');
                if (!shell) {
                    return 420;
                }
                return Math.max(320, shell.clientHeight - 2);
            }

            function updateToolbarStats(visibleCount, totalCount) {
                $('#departmentVisibleCount').text(visibleCount || 0);
                $('#departmentTotalCount').text(totalCount || 0);
            }

            function updateScopeLabel() {
                $('#departmentScopeLabel').text('当前范围：' + (currentFilters.parentName || '全部部门'));
            }

            function applyFilters(data) {
                return (data || []).filter(function(dept) {
                    var matchParent = true;
                    if (currentFilters.parentId) {
                        matchParent = String(dept.parent_id || 0) === String(currentFilters.parentId) || String(dept.id) === String(currentFilters.parentId);
                    }

                    var matchStatus = true;
                    if (currentFilters.status !== '') {
                        matchStatus = String(dept.status) === String(currentFilters.status);
                    }

                    var matchKeyword = true;
                    if (currentFilters.keyword) {
                        var keyword = currentFilters.keyword.toLowerCase();
                        var haystack = [
                            dept.name,
                            dept.parent_name,
                            dept.leader_name,
                            dept.code
                        ].join(' ').toLowerCase();
                        matchKeyword = haystack.indexOf(keyword) >= 0;
                    }

                    return matchParent && matchStatus && matchKeyword;
                });
            }

            // 渲染部门树形结构
            var departmentData = JSON.parse('{{ department_tree_json|safe|default:"[]" }}');
            if (departmentData && departmentData.length > 0) {
                layui.tree.render({
                    elem: '#departmentTree',
                    data: departmentData,
                    showLine: true,
                    showCheckbox: false,
                    id: 'departmentTreeId',
                    click: function(obj){
                        currentFilters.parentId = obj.data.id;
                        currentFilters.parentName = obj.data.title || '已选部门';
                        updateScopeLabel();
                        table.reload('departmentTable', {
                            height: getTableHeight(),
                            page: { curr: 1 }
                        });
                    }
                });
            } else {
                $('#departmentTree').html('<div style="padding: 20px; text-align: center; color: #999;">暂无部门数据</div>');
            }

            updateScopeLabel();
            syncWorkspaceHeight();

            function buildTreeData(data) {
                var deptMap = {};
                var rootDepts = [];

                data.forEach(function(dept) {
                    deptMap[dept.id] = dept;
                    dept.children = [];
                });

                data.forEach(function(dept) {
                    if (dept.parent_id && dept.parent_id !== 0 && deptMap[dept.parent_id]) {
                        deptMap[dept.parent_id].children.push(dept);
                    } else {
                        rootDepts.push(dept);
                    }
                });

                var flatData = [];

                function flattenTree(depts, level = 0) {
                    depts.forEach(function(dept) {
                        dept.level = level;
                        flatData.push(dept);
                        if (dept.children && dept.children.length > 0) {
                            flattenTree(dept.children, level + 1);
                        }
                    });
                }

                rootDepts.sort(function(a, b) {
                    if (a.sort !== b.sort) {
                        return a.sort - b.sort;
                    }
                    return a.id - b.id;
                });

                flattenTree(rootDepts);
                return flatData;
            }

            function refreshDepartmentTableAfterMutation() {
                table.reload('departmentTable', {
                    height: getTableHeight()
                });
            }

            function changeDepartmentStatus(data, nextStatus, successText) {
                var confirmText = nextStatus === 1 ? '确定要启用该部门吗？' : '确定要禁用该部门吗？';
                layer.confirm(confirmText, function(index) {
                    $.ajax({
                        url: '/system/department/' + data.id + '/change_status/',
                        type: 'POST',
                        data: {status: nextStatus},
                        headers: {
                            'X-CSRFToken': getCsrfToken()
                        },
                        success: function(res) {
                            if (res.code === 0) {
                                layer.msg(successText, {icon: 1});
                                refreshDepartmentTableAfterMutation();
                                layer.close(index);
                            } else {
                                layer.msg(res.msg || '操作失败', {icon: 5});
                            }
                        },
                        error: function() {
                            layer.msg('网络错误', {icon: 5});
                        }
                    });
                });
            }

            function deleteDepartmentRow(data) {
                layer.confirm('确定要删除该部门吗？删除后无法恢复，且该部门下的所有子部门和员工也会受到影响。', function(index) {
                    $.ajax({
                        url: '/system/department/' + data.id + '/delete/',
                        type: 'POST',
                        headers: {
                            'X-CSRFToken': getCsrfToken()
                        },
                        success: function(res) {
                            if (res.code === 0) {
                                layer.msg('删除成功', {icon: 1});
                                refreshDepartmentTableAfterMutation();
                                layer.close(index);
                            } else {
                                layer.msg(res.msg || '删除失败', {icon: 5});
                            }
                        },
                        error: function() {
                            layer.msg('网络错误', {icon: 5});
                        }
                    });
                });
            }

            function handleTableAction(action, data) {
                if (action === 'detail') {
                    openSlidePanel('部门详情', '/system/department/' + data.id + '/detail/');
                } else if (action === 'edit') {
                    openSlidePanel('编辑部门', '/system/department/' + data.id + '/update/');
                } else if (action === 'role_management') {
                    openSlidePanel('部门角色管理', '/user/department/' + data.id + '/roles/');
                } else if (action === 'disable') {
                    changeDepartmentStatus(data, 0, '部门已禁用');
                } else if (action === 'enable') {
                    changeDepartmentStatus(data, 1, '部门已启用');
                } else if (action === 'delete') {
                    deleteDepartmentRow(data);
                }
            }

            table.render({
                elem: '#departmentTable',
                url: '/system/department/department-list-api/',
                height: getTableHeight(),
                page: true,
                limit: 10,
                limits: [10, 15, 20, 30],
                cols: [[
                    { field: 'id', title: 'ID', width: 80 },
                    { field: 'name', title: '部门名称', width: 280, templet: function(d) {
                        var level = d.level || 0;
                        var levelClass = 'department-level-' + Math.min(level + 1, 6);
                        var hasChildren = d.children && d.children.length > 0;
                        var icon = '<i class="layui-icon layui-icon-organization" style="margin-right:5px;color:#4e89ae;"></i>';

                        if (level === 0) {
                            return '<div class="department-name ' + levelClass + '">' + icon + d.name + '</div>';
                        } else {
                            var indicatorClass = hasChildren ? 'level-indicator has-children' : 'level-indicator';
                            var indicator = '<span class="' + indicatorClass + '"></span>';
                            return '<div class="department-name ' + levelClass + '">' + indicator + icon + d.name + '</div>';
                        }
                    }},
                    { field: 'parent_name', title: '上级部门', width: 150 },
                    { field: 'leader_name', title: '负责人', width: 120 },
                    { field: 'leader_phone', title: '负责人电话', width: 150, templet: function(d) {
                        return d.leader_phone || '-';
                    }},
                    { field: 'sort', title: '排序', width: 80 },
                    { field: 'status', title: '状态', width: 100, templet: '#statusTpl' },
                    { field: 'roles', title: '已分配角色', width: 200, templet: function(d) {
                        return d.roles && d.roles.length > 0 ? d.roles.join(', ') : '<span style="color: #999;">未分配</span>';
                    }},
                    { title: '操作', width: 360, toolbar: '#barTpl' }
                ]],
                parseData: function(res) {
                    if (res.code === 0) {
                        var filteredData = applyFilters(res.data || []);
                        var treeData = buildTreeData(filteredData);
                        return {
                            "code": 0,
                            "msg": "",
                            "count": treeData.length,
                            "data": treeData
                        };
                    } else {
                        return {
                            "code": 1,
                            "msg": res.msg || '获取数据失败',
                            "count": 0,
                            "data": []
                        };
                    }
                },
                done: function(res, curr, count) {
                    updateToolbarStats((res.data || []).length, count);
                }
            });

            function reloadDepartmentTable() {
                table.reload('departmentTable', {
                    height: getTableHeight(),
                    page: { curr: 1 }
                });
            }

            table.on('tool(departmentTable)', function(obj) {
                var data = obj.data;
                handleTableAction(obj.event, data);
            });

            function openSlidePanel(title, url) {
                $('#panelTitle').text(title);
                $('#slidePanelContent').load(url, function() {
                    layui.form.render();
                    var scrollPos = $(window).scrollTop();
                    $('body')
                        .data('scroll-pos', scrollPos)
                        .css('--scroll-pos', -scrollPos + 'px')
                        .addClass('slide-panel-open');
                    $('#slidePanelOverlay').addClass('active');
                    $('#slidePanelWrapper').addClass('active');
                });
            }

            $('#addBtn').click(function() {
                openSlidePanel('添加部门', '/system/department/add/');
            });

            $('#searchBtn').on('click', function() {
                currentFilters.status = $('#departmentStatusFilter').val() || '';
                currentFilters.keyword = $.trim($('#departmentKeywordFilter').val());
                reloadDepartmentTable();
            });

            $('#resetBtn').on('click', function() {
                currentFilters.parentId = null;
                currentFilters.parentName = '全部部门';
                currentFilters.status = '';
                currentFilters.keyword = '';
                $('#departmentStatusFilter').val('');
                $('#departmentKeywordFilter').val('');
                form.render('select');
                updateScopeLabel();
                reloadDepartmentTable();
            });

            $('#departmentKeywordFilter').on('keydown', function(event) {
                if (event.keyCode === 13) {
                    event.preventDefault();
                    $('#searchBtn').trigger('click');
                }
            });

            $('#slidePanelClose').on('click', function() {
                closeSlidePanel();
            });

            $('#slidePanelOverlay').on('click', function() {
                closeSlidePanel();
            });

            $(document).on('keydown', function(e) {
                if (e.keyCode === 27 && $('body').hasClass('slide-panel-open')) {
                    closeSlidePanel();
                }
            });

            $(window).on('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    syncWorkspaceHeight();
                    table.reload('departmentTable', {
                        height: getTableHeight()
                    });
                }, 80);
            });
        });
    </script>
</body>
</html>
