<script>
    layui.use(['layer', 'jquery'], function(){
        var layer = layui.layer;
        var $ = layui.jquery;
        var formSelector = '#{{ popup_form_id|escapejs }}';
        var backUrl = '{{ popup_back_url|escapejs }}';

        function getParentLayerIndex() {
            try {
                if (window.parent && window.parent !== window && window.parent.layer) {
                    return window.parent.layer.getFrameIndex(window.name);
                }
            } catch (error) {
                return null;
            }
            return null;
        }

        function isLayerFrame() {
            var index = getParentLayerIndex();
            return index !== null && index !== undefined && index !== '';
        }

        window.closePopupForm = function() {
            var index = getParentLayerIndex();
            if (isLayerFrame()) {
                window.parent.layer.close(index);
                return;
            }
            window.location.href = backUrl;
        };

        $(formSelector).on('submit', function(event) {
            if (!isLayerFrame()) {
                return true;
            }

            event.preventDefault();
            var $form = $(this);
            $.ajax({
                url: $form.attr('action') || window.location.href,
                type: 'POST',
                data: $form.serialize(),
                dataType: 'json',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                },
                success: function(res) {
                    if (res.code === 0) {
                        layer.msg(res.msg || '保存成功', {icon: 1, time: 800}, function() {
                            closePopupForm();
                        });
                    } else {
                        layer.msg(res.msg || '保存失败', {icon: 2});
                    }
                },
                error: function() {
                    layer.msg('保存失败，请稍后重试', {icon: 2});
                }
            });
            return false;
        });
    });
</script>
