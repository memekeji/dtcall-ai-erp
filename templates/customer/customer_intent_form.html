<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% if object %}编辑客户意向{% else %}新增客户意向{% endif %}</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/static/layui/css/layui.css" media="all">
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-header">
                        <h3>{% if object %}编辑客户意向{% else %}新增客户意向{% endif %}</h3>
                    </div>
                    <div class="layui-card-body">
                        <form class="layui-form" method="post" id="intentForm">
                            {% csrf_token %}
                            {% if form.errors %}
                                <div class="layui-form-item">
                                    <div class="layui-input-block">
                                        <div class="layui-alert layui-bg-red" style="margin: 10px 0;">
                                            {% for field in form %}
                                                {% for error in field.errors %}
                                                    <div>{{ field.label }}: {{ error }}</div>
                                                {% endfor %}
                                            {% endfor %}
                                            {% for error in form.non_field_errors %}
                                                <div>{{ error }}</div>
                                            {% endfor %}
                                        </div>
                                    </div>
                                </div>
                            {% endif %}
                            <div class="layui-row layui-col-space15">
                                <div class="layui-col-md6">
                                    <div class="layui-form-item">
                                        <label class="layui-form-label">意向名称 <span style="color: red;">*</span></label>
                                        <div class="layui-input-block">
                                            <input type="text" name="name" placeholder="请输入意向名称" class="layui-input" value="{% if object %}{{ object.name }}{% endif %}" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-col-md6">
                                    <div class="layui-form-item">
                                        <label class="layui-form-label">排序</label>
                                        <div class="layui-input-block">
                                            <input type="number" name="sort" placeholder="排序号" class="layui-input" value="{% if object %}{{ object.sort }}{% else %}0{% endif %}">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="layui-form-item">
                                <label class="layui-form-label">状态</label>
                                <div class="layui-input-block">
                                    <input type="checkbox" name="status" {% if not object or object.status %}checked{% endif %} lay-skin="switch" lay-text="启用|禁用">
                                </div>
                            </div>
                            
                            <div class="layui-form-item">
                                <div class="layui-input-block">
                                    <button class="layui-btn" type="submit">保存</button>
                                    <button type="button" class="layui-btn layui-btn-primary" onclick="closeIntentForm()">返回</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/layui/layui.js"></script>
    <script>
        layui.use(['form', 'layer', 'jquery'], function(){
            var form = layui.form;
            var layer = layui.layer;
            var $ = layui.jquery;
            form.render();

            function getParentLayerIndex() {
                try {
                    if (window.parent && window.parent !== window && window.parent.layer) {
                        return window.parent.layer.getFrameIndex(window.name);
                    }
                } catch (error) {
                    return null;
                }
                return null;
            }

            function isLayerFrame() {
                var index = getParentLayerIndex();
                return index !== null && index !== undefined && index !== '';
            }

            window.closeIntentForm = function() {
                var index = getParentLayerIndex();
                if (isLayerFrame()) {
                    window.parent.layer.close(index);
                    return;
                }
                window.location.href = "{% url 'customer:customer_intent_list' %}";
            };

            $('#intentForm').on('submit', function(event) {
                if (!isLayerFrame()) {
                    return true;
                }

                event.preventDefault();
                var $form = $(this);
                $.ajax({
                    url: $form.attr('action') || window.location.href,
                    type: 'POST',
                    data: $form.serialize(),
                    dataType: 'json',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    success: function(res) {
                        if (res.code === 0) {
                            layer.msg(res.msg || '保存成功', {icon: 1, time: 800}, function() {
                                closeIntentForm();
                            });
                        } else {
                            layer.msg(res.msg || '保存失败', {icon: 2});
                        }
                    },
                    error: function() {
                        layer.msg('保存失败，请稍后重试', {icon: 2});
                    }
                });
                return false;
            });
        });
    </script>
</body>
</html>
