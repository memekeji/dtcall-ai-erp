<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权限不足 - 系统提示</title>
    <link rel="stylesheet" href="{% static 'css/dtcall-ui.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.92), rgba(238,247,255,0.9)),
                radial-gradient(circle at 18% 8%, rgba(22, 119, 255, 0.18), transparent 28%),
                linear-gradient(180deg, #f7fbff 0%, #eef5fc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border: 1px solid #e5edf6;
            border-radius: 8px;
            box-shadow: 0 18px 42px rgba(15, 23, 42, 0.14);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        
        .icon {
            font-size: 80px;
            color: #f56c6c;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 32px;
            color: #303133;
            margin-bottom: 16px;
        }
        
        p {
            font-size: 16px;
            color: #606266;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(135deg, #1677ff 0%, #06b6d4 100%);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            background: linear-gradient(135deg, #0f5bd8 0%, #0891b2 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(22, 119, 255, 0.24);
        }
        
        .info {
            margin-top: 24px;
            padding: 16px;
            background: #f0f5ff;
            border: 1px solid #d9ecff;
            border-radius: 6px;
            font-size: 14px;
            color: #409eff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚫</div>
        <h1>权限不足</h1>
        <p>抱歉，您没有权限访问此页面或执行此操作。请联系系统管理员获取相关权限。</p>
        <a href="javascript:history.back()" class="btn">返回上一页</a>
        <div class="info">
            <strong>提示：</strong>若您认为这是系统错误，请记录当前时间并联系系统管理员，我们将尽快为您处理。
        </div>
    </div>
</body>
</html>
