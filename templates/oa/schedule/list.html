{% extends 'include/common.html' %}

{% block title %}工作日程列表{% endblock %}

{% block content %}
<div class="layui-card">
    <div class="layui-card-header">
        <div class="layui-row">
            <div class="layui-col-md6">
                <span class="layui-breadcrumb">
                    <a href="javascript:;">OA办公</a>
                    <a><cite>工作日程</cite></a>
                </span>
            </div>
            <div class="layui-col-md6" style="text-align: right;">
                <button class="layui-btn" id="addBtn">新增日程</button>
                <a href="{% url 'oa_schedule_calendar' %}" class="layui-btn layui-btn-normal">日历视图</a>
            </div>
        </div>
    </div>
    <div class="layui-card-body">
        <form class="layui-form" style="margin-bottom: 16px;">
            <div class="layui-row layui-col-space12">
                <div class="layui-col-md3">
                    <input type="text" name="keywords" id="keywords" placeholder="搜索日程标题" class="layui-input">
                </div>
                <div class="layui-col-md2">
                    <select name="labor_type" id="laborType">
                        <option value="">全部类型</option>
                        <option value="1">案头工作</option>
                        <option value="2">外勤工作</option>
                    </select>
                </div>
                <div class="layui-col-md3">
                    <input type="text" name="diff_time" id="diffTime" placeholder="日期范围，如 2026-04-01 ~ 2026-04-30" class="layui-input">
                </div>
                <div class="layui-col-md4">
                    <button type="button" class="layui-btn" id="searchBtn">查询</button>
                    <button type="button" class="layui-btn layui-btn-primary" id="resetBtn">重置</button>
                </div>
            </div>
        </form>

        <table class="layui-table layui-form" lay-skin="line">
            <thead>
                <tr>
                    <th style="width: 16%;">日程标题</th>
                    <th style="width: 15%;">时间区间</th>
                    <th style="width: 8%;">工时</th>
                    <th style="width: 8%;">类型</th>
                    <th style="width: 10%;">工作分类</th>
                    <th style="width: 10%;">关联任务</th>
                    <th>工作说明</th>
                    <th style="width: 12%;">操作</th>
                </tr>
            </thead>
            <tbody id="scheduleTableBody">
                <tr>
                    <td colspan="8" style="text-align:center; color:#999; padding:50px 0;">正在加载日程数据...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
layui.use(['layer', 'form', 'jquery'], function () {
    var layer = layui.layer;
    var form = layui.form;
    var $ = layui.jquery;

    function openRightDrawer(title, url, onClose) {
        layer.open({
            type: 2,
            title: title,
            shadeClose: false,
            shade: 0.25,
            maxmin: true,
            area: ['80%', '100%'],
            offset: 'r',
            anim: 2,
            content: url,
            success: function (layero) {
                if (layero && typeof layero.css === 'function') {
                    layero.css({'right': '0', 'top': '0', 'height': '100%'});
                }
            },
            end: function () {
                if (typeof onClose === 'function') {
                    onClose();
                }
            }
        });
    }

    function currentParams() {
        return {
            format: 'json',
            keywords: $('#keywords').val(),
            labor_type: $('#laborType').val(),
            diff_time: $('#diffTime').val()
        };
    }

    function renderRows(items) {
        var tbody = $('#scheduleTableBody');
        if (!items || !items.length) {
            tbody.html('<tr><td colspan="8" style="text-align:center; color:#999; padding:50px 0;">暂无符合条件的日程记录</td></tr>');
            return;
        }

        var rows = items.map(function (item) {
            return '' +
                '<tr>' +
                '<td>' + (item.title || '-') + '</td>' +
                '<td>' + (item.start_time || '-') + '<br>' + (item.end_time || '-') + '</td>' +
                '<td>' + (item.labor_time || 0) + '</td>' +
                '<td>' + (item.labor_type || '-') + '</td>' +
                '<td>' + (item.work_cate || '-') + '</td>' +
                '<td><div>' + (item.project && item.project !== '-' ? item.project + '<br>' : '') + (item.task || '-') + '</div></td>' +
                '<td>' + (item.content || '-') + '</td>' +
                '<td>' +
                '<button type="button" class="layui-btn layui-btn-xs view-btn" data-id="' + item.id + '">查看</button>' +
                '<button type="button" class="layui-btn layui-btn-xs layui-btn-danger delete-btn" data-id="' + item.id + '">删除</button>' +
                '</td>' +
                '</tr>';
        });
        tbody.html(rows.join(''));
    }

    function loadData() {
        $.get('{% url "oa_schedule" %}', currentParams(), function (res) {
            if (res.code === 0) {
                renderRows(res.data || []);
            } else {
                $('#scheduleTableBody').html('<tr><td colspan="8" style="text-align:center; color:#f00; padding:50px 0;">' + (res.msg || '加载失败') + '</td></tr>');
            }
        }).fail(function () {
            $('#scheduleTableBody').html('<tr><td colspan="8" style="text-align:center; color:#f00; padding:50px 0;">请求失败，请稍后重试</td></tr>');
        });
    }

    $('#addBtn').on('click', function () {
        openRightDrawer('新增工作日程', '{% url "oa_schedule_add" %}', loadData);
    });

    $('#searchBtn').on('click', loadData);
    $('#resetBtn').on('click', function () {
        $('#keywords').val('');
        $('#laborType').val('');
        $('#diffTime').val('');
        form.render('select');
        loadData();
    });

    $('#scheduleTableBody').on('click', '.view-btn', function () {
        var scheduleId = $(this).data('id');
        openRightDrawer('日程详情', '{% url "oa_schedule_view" 0 %}'.replace('0', scheduleId));
    });

    $('#scheduleTableBody').on('click', '.delete-btn', function () {
        var scheduleId = $(this).data('id');
        layer.confirm('确认删除该日程记录吗？删除后将无法恢复。', function (index) {
            $.ajax({
                url: '{% url "oa_schedule_delete" 0 %}'.replace('0', scheduleId),
                type: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                success: function (res) {
                    if (res.code === 0) {
                        layer.msg(res.msg || '删除成功', {icon: 1});
                        loadData();
                    } else {
                        layer.msg(res.msg || '删除失败', {icon: 2});
                    }
                },
                error: function () {
                    layer.msg('删除失败，请稍后重试', {icon: 2});
                }
            });
            layer.close(index);
        });
    });

    form.render();
    loadData();
});
</script>
{% endblock %}
